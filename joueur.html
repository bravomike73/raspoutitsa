<head>

<link rel="manifest" href="manifest.webmanifest">

<style>
/* Mise en page : bandeau de tour, plateau défilant à gauche, panneau de phase à droite, frise en bas */
:root {
  --bg: #efede8; --panel: #ffffff; --ink: #1d2126; --muted: #646a73; --line: #d8d3ca; --soft: #f6f4f0;
  --B: #1d5fbf; --Bs: #dce8f8; --R: #c62828; --Rs: #f9dede; --ok: #2e7d32; --oks: #e3f1e4; --warn: #a15c00; --warns: #fdf0d9; --err: #b3261e; --errs: #fbe3e1;
  --hl: #ffd400; --accent: var(--B); --accents: var(--Bs);
}
body.R { --accent: var(--R); --accents: var(--Rs); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.42 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 6px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.small { padding: 3px 8px; font-size: 12.5px; }
button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.chip.B { background: var(--Bs); color: var(--B); } .chip.R { background: var(--Rs); color: var(--R); }
.notice { padding: 7px 10px; border-radius: 7px; margin: 6px 0; font-size: 13px; }
.notice.ok { background: var(--oks); color: var(--ok); } .notice.warn { background: var(--warns); color: var(--warn); } .notice.err { background: var(--errs); color: var(--err); }
/* bandeau */
header { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; white-space: nowrap; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
#saveInfo { flex: 0 1 auto; min-width: 0; }
header h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
.hstat { display: flex; gap: 12px; flex-wrap: nowrap; font-size: 12.5px; flex: none; }   /* jamais rognée : PC, BSC, DIV+, POW, AAE, ALAT et FS restent visibles (7 nov.) */
.hstat b { font-weight: 600; }
.gauge { display: inline-flex; gap: 2px; vertical-align: -1px; margin-left: 3px; }
.gauge i { width: 9px; height: 11px; border-radius: 2px; background: var(--accent); display: inline-block; }
.gauge i.off { background: var(--line); }
.gauge.g10 i { width: 5px; } .gauge i.mid { background: #e08a00; } .gauge i.low { background: var(--err); }
.hsep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
.hbox { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 6px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid rgba(0,0,0,.12); }
.hbox.lv-bleu { background: #1d5fbf; color: #fff; } .hbox.lv-vert { background: #2e7d32; color: #fff; } .hbox.lv-jaune { background: #f2c811; color: #1d2126; }
.hbox.lv-orange { background: #ef8a00; color: #1d2126; } .hbox.lv-rouge { background: #c62828; color: #fff; } .hbox.lv-ecarlate { background: #ff2400; color: #fff; box-shadow: 0 0 0 2px rgba(255,36,0,.35); }
.hbox.pw-ok { background: #d7efd8; color: #1e5a22; } .hbox.pw-eq { background: #ef8a00; color: #1d2126; } .hbox.pw-over { background: #c62828; color: #fff; }
.hcur { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.hcur .gauge i.c4 { background: #1d5fbf; } .hcur .gauge i.c3 { background: #2e7d32; } .hcur .gauge i.c2 { background: #ef8a00; } .hcur .gauge i.c1 { background: #c62828; }
/* TUTO-DEBUT : conseils du tutoriel (10 nov.) */
#tutoDlg { width: min(600px, 94vw); }
#tutoDlg .dlg { padding: 0; }
#tutoHead { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: var(--accent); color: #fff; border-radius: 12px 12px 0 0; }
#tutoPor { flex: none; width: 92px; height: 92px; border-radius: 50%; object-fit: cover; background: #0b1530; box-shadow: 0 0 0 3px #fff, 0 3px 12px rgba(0,0,0,.35); }
#tutoHead .k { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
#tutoHead h2 { margin: 2px 0 0; font-size: 20px; letter-spacing: .02em; }
#tutoHead .s { font-size: 13px; opacity: .9; margin-top: 2px; }
#tutoBody { padding: 14px 22px 4px; font-size: 15px; line-height: 1.6; }
#tutoDlg .acts { padding: 10px 22px 16px; margin: 0; align-items: center; }
#tutoDlg .acts label { margin-right: auto; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
@media (max-width: 560px) { #tutoPor { width: 68px; height: 68px; } #tutoHead h2 { font-size: 17px; } #tutoBody { font-size: 14px; } }
/* TUTO-FIN */
/* compte rendu en fenêtre */
#crDlg { width: min(860px, 96vw); }
#crDlg .dlg { display: flex; flex-direction: column; max-height: 90vh; padding: 0; }
#crHead { padding: 16px 22px 12px; background: var(--accent); color: #fff; border-radius: 12px 12px 0 0; }
#crHead .k { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
#crHead h2 { margin: 2px 0 0; font-size: 21px; letter-spacing: .02em; }
#crBody { overflow: auto; padding: 6px 24px 10px; font-size: 14.5px; line-height: 1.6; }
#crBody h3 { margin: 18px 0 6px; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; text-decoration-color: var(--accent); }
#crBody ul { margin: 0; padding-left: 20px; } #crBody li { margin: 5px 0; }
#crBody li.alert { list-style: none; margin-left: -20px; padding: 8px 12px; border-left: 4px solid var(--err); background: var(--errs); border-radius: 6px; }
#crBody b { font-weight: 700; }
#crBody .div { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; margin: 6px 0; border-radius: 8px; background: var(--soft); border-left: 4px solid var(--muted); }
#crBody .div.up { border-left-color: var(--ok); background: var(--oks); } #crBody .div.down { border-left-color: var(--err); background: var(--errs); }
#crBody .div .n { font-weight: 700; white-space: nowrap; flex: 0 0 150px; }
#crBody .div .q { font-style: italic; }
#crBody .div .m { margin-left: auto; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
#crBody .gz { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
#crBody .gz span { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
#crDlg .acts { padding: 10px 22px 16px; margin: 0; border-top: 1px solid var(--line); }
/* évasion de prisonniers */
.evaArea { fill: rgba(224,138,0,.18); stroke: #e08a00; stroke-width: 8; stroke-dasharray: 18 10; pointer-events: none; animation: fxPulse .8s ease-in-out infinite alternate; }
.evaPow { fill: none; stroke: #e08a00; stroke-width: 12; pointer-events: none; animation: fxPulse .45s ease-in-out infinite alternate; }
.evaRoll { opacity: 0; animation: fadeIn .35s forwards; }
.evaDie { font: 800 26px system-ui, sans-serif; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 6px; pointer-events: none; }
.evaRun { fill: #e08a00; opacity: 0; pointer-events: none; animation: evaRun 1.4s ease-out forwards; }
@keyframes evaRun { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
.cbMark { font: 700 20px system-ui, sans-serif; fill: #6a1b9a; paint-order: stroke; stroke: #fff; stroke-width: 5px; pointer-events: none; }
/* ART CA en mission de contre-batterie (7 nov.) : bandeau « CB » au bas du pion, à moitié dessus, à moitié dessous */
.cbBadge rect { fill: #6a1b9a; stroke: #fff; stroke-width: 3; }
.cbBadge text { font: 900 24px system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; letter-spacing: 2px; }
.cbBadge { pointer-events: none; }
/* frappe en profondeur et tir de contre-batterie : l'obus part de l'ART CA et suit une parabole jusqu'à la cible (7 nov.) */
.fxShell { fill: #111; stroke: #fff; stroke-width: 3; pointer-events: none; }
.fxTraj { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 2 16; stroke-linecap: round; opacity: .55; pointer-events: none; }
.fxSrc { fill: none; stroke: #ffb300; stroke-width: 10; pointer-events: none; animation: fxPulse .45s ease-in-out infinite alternate; }
.fxSrc.en { stroke: #b3261e; }
.fxSrcLbl { font: 800 22px system-ui, sans-serif; fill: #000; paint-order: stroke; stroke: #fff; stroke-width: 6px; text-anchor: middle; pointer-events: none; }
.fxAim { fill: none; stroke: #111; stroke-width: 5; stroke-dasharray: 10 8; pointer-events: none; }
.fxLate { opacity: 0; animation: fxShow .3s forwards; }
@keyframes fxShow { to { opacity: 1; } }
.fxBoom { fill: #ffcf33; stroke: #b3261e; stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; animation: fxBoom .7s ease-out forwards; pointer-events: none; }
@keyframes fxBoom { 0% { opacity: .95; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.6); } }
@media (prefers-reduced-motion: reduce) { .fxLate { animation: none; opacity: 1; } .fxBoom { display: none; } .fxSrc { animation: none; } }
.cbArea { fill: none; stroke: #6a1b9a; stroke-width: 5; stroke-dasharray: 6 10; opacity: .7; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .evaArea, .evaPow { animation: none; } .evaRoll { animation: none; opacity: 1; } .evaRun { display: none; } }

.spacer { flex: 1; }
/* corps */
main { flex: 1; min-height: 0; display: flex; }
#boardWrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
#prompt { padding: 6px 12px; background: var(--hl); font-weight: 600; font-size: 13px; display: none; }
#prompt button { margin-left: 10px; }
#scroller { flex: 1; overflow: auto; background: #cfcac0; position: relative; cursor: grab; }
#scroller.dragging, #scroller.dragging * { cursor: grabbing !important; }
#stage { display: flex; height: 100%; min-height: 420px; }
#side { width: 210px; flex: none; background: var(--soft); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: auto; }
html.sideHidden #side { display: none; }
#side h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.box { border: 2px dashed var(--line); border-radius: 8px; padding: 6px; min-height: 60px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; background: #fff; }
.box.target { border-color: var(--hl); background: #fffbe0; cursor: pointer; }
.tok { display: inline-flex; padding: 2px; border-radius: 5px; background: var(--accent); cursor: pointer; border: 2px solid transparent; position: relative; }
.tok img { width: 34px; height: 34px; display: block; border-radius: 3px; }
.tok.big img { width: 40px; height: 40px; }
.tok.sel { border-color: var(--hl); box-shadow: 0 0 0 2px #000 inset; }
.tok.neut img { opacity: .45; } .tok.neut { background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 4px, #888 4px, #888 8px); }
.tok.ghost { opacity: .55; outline: 2px dashed var(--accent); }
.tok.fixed { background: #9a9a9a; cursor: default; } .tok.fixed img { filter: grayscale(1); opacity: .6; }
.tg { display: flex; align-items: center; gap: 6px; width: 100%; }
.tg .n { margin-left: auto; font-size: 12px; color: var(--muted); }
#boardBox { position: relative; height: 100%; flex: none; }
#boardBox img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
#boardBox svg { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; }
#zoomBar { position: absolute; right: 10px; top: 8px; display: flex; gap: 4px; z-index: 3; }
/* svg */
.hit { fill: rgba(0,0,0,0); cursor: pointer; }
.hit.legal { fill: rgba(255,212,0,.38); stroke: #e0a800; stroke-width: 5; }
.hit.chosen { fill: rgba(255,212,0,.6); stroke: #000; stroke-width: 6; }
.hit:hover { fill: rgba(255,255,255,.28); }
.hit.legal:hover { fill: rgba(255,212,0,.65); }
.ut rect { stroke: #fff; stroke-width: 3; }
.ut text { font: 700 19px system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.ut.big text { font-size: 24px; }
.ut.sel rect { stroke: var(--hl); stroke-width: 8; }
.ut.ghost rect { opacity: .5; stroke-dasharray: 8 5; stroke: #000; }
.artArrow { fill: #111; stroke: #fff; stroke-width: 3px; paint-order: stroke; pointer-events: none; }
.neutLbl { font: 700 15px system-ui, sans-serif; fill: #000; paint-order: stroke; stroke: #fff; stroke-width: 4px; text-anchor: middle; pointer-events: none; }
.intel rect { stroke: #222; stroke-width: 3; }
.intel text { font: 700 17px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.age { font: 600 14px system-ui, sans-serif; fill: #222; paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
.corBadge circle { stroke: #fff; stroke-width: 4; pointer-events: none; }
.enNetArr { stroke: #fff; stroke-width: 3; opacity: .9; pointer-events: none; }
#svg .corBadge.enNet text.age { font: 700 15px system-ui, sans-serif; fill: #222; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.corBadge text { font: 800 24px system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.flowLbl { font: 700 16px system-ui, sans-serif; fill: #000; paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
.fog { fill: rgba(40,40,46,.30); pointer-events: none; }
/* zones à viser (7 nov.) : fond orangé, limites noires entre zones, nom juste au-dessus du nom imprimé sur le plateau */
.area { fill: rgba(255,170,0,.22); stroke: #000; stroke-width: 6; stroke-linejoin: round; pointer-events: none; }
.area.chosen { fill: rgba(255,170,0,.5); stroke: #000; stroke-width: 11; }
.areaLbl { font: 800 30px system-ui, sans-serif; fill: #000; paint-order: stroke; stroke: #ffb300; stroke-width: 8px; text-anchor: middle; pointer-events: none; }
.logCount { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-radius: 10px; margin: 6px 0 8px; font-weight: 700; }
.logCount .big { font-size: 30px; line-height: 1; white-space: nowrap; }
.logCount.ok { background: var(--oks); color: var(--ok); } .logCount.low { background: var(--warns); color: var(--warn); } .logCount.over { background: var(--errs); color: var(--err); }
.mark { font: 800 22px system-ui, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 5px; pointer-events: none; }
/* neutralisations : lisibles même dans un pion ou une pastille de corridor (qui écrivent en blanc) */
#svg text.neutLbl { font: 800 18px system-ui, sans-serif; fill: #b3261e; paint-order: stroke; stroke: #fff; stroke-width: 5px; text-anchor: middle; dominant-baseline: auto; }
#svg .corBadge text.mark { font: 800 22px system-ui, sans-serif; fill: #b3261e; paint-order: stroke; stroke: #fff; stroke-width: 5px; text-anchor: start; dominant-baseline: auto; }
.neutArea { fill: rgba(179,38,30,.12); stroke: #b3261e; stroke-width: 6; stroke-dasharray: 18 10; pointer-events: none; }
.cutX { stroke: #b3261e; stroke-width: 7; stroke-linecap: round; }
.cutX.neut { stroke-dasharray: 14 9; }
#svg .corBadge text.flowLbl { font: 800 20px system-ui, sans-serif; fill: #a15c00; paint-order: stroke; stroke: #fff; stroke-width: 5px; text-anchor: start; dominant-baseline: auto; }
/* mise à jour du plateau : chaque action réussie du tour est mise en évidence, l'une après l'autre */
.fxArea { fill: rgba(255,212,0,.22); stroke: #ffb300; stroke-width: 10; pointer-events: none; animation: fxPulse .7s ease-in-out infinite alternate; }
.fxBox { fill: rgba(255,212,0,.30); stroke: #ffb300; stroke-width: 9; pointer-events: none; animation: fxPulse .7s ease-in-out infinite alternate; }
.fxLbl { font: 800 30px system-ui, sans-serif; fill: #000; paint-order: stroke; stroke: #ffd400; stroke-width: 8px; text-anchor: middle; pointer-events: none; }
@keyframes fxPulse { from { stroke-opacity: 1; fill-opacity: 1; } to { stroke-opacity: .25; fill-opacity: .35; } }
#fxToast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; background: #15181c; color: #fff; border-radius: 10px; padding: 8px 12px; display: none; align-items: center; gap: 10px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.35); white-space: nowrap; }
#fxToast b { color: #ffd400; }
#fxToast button { color: var(--ink); }
.fxHit { fill: rgba(179,38,30,.22); stroke: #b3261e; stroke-width: 10; pointer-events: none; animation: fxPulse .7s ease-in-out infinite alternate; }
.fxHitArea { fill: rgba(179,38,30,.18); stroke: #b3261e; stroke-width: 10; pointer-events: none; animation: fxPulse .7s ease-in-out infinite alternate; }
.fxMiss { fill: rgba(110,110,110,.15); stroke: #6b6b6b; stroke-width: 7; stroke-dasharray: 16 10; pointer-events: none; }
.fxDead { stroke: #000; stroke-width: 9; stroke-linecap: round; pointer-events: none; }
.fxHitLbl { font: 800 24px system-ui, sans-serif; fill: #fff; paint-order: stroke; stroke: #b3261e; stroke-width: 9px; text-anchor: middle; pointer-events: none; }
#svg text.fxLbl.en { stroke: #ffb4a9; }
#fxToast.en { background: #5c1410; } #fxToast.en b { color: #ffb4a9; }
.divGlow { fill: rgba(255,179,0,.18); stroke: #ffb300; stroke-width: 10; pointer-events: none; filter: drop-shadow(0 0 16px #ffb300); animation: divGlow 1.4s ease-in-out infinite alternate; }
.enEngBlink { fill: var(--c); fill-opacity: .08; stroke: var(--c); stroke-width: 8; stroke-opacity: .5; pointer-events: none; animation: enEng 1.8s ease-in-out infinite alternate; }
@keyframes enEng { from { fill-opacity: .04; stroke-opacity: .25; } to { fill-opacity: .28; stroke-opacity: .9; } }
.enEngLbl { fill: #b71c1c; font-weight: 800; }
.deadX { stroke: #000; stroke-width: 7; stroke-linecap: round; pointer-events: none; }
#fxToast.miss { background: #3b3b3b; } #fxToast.miss b { color: #e0e0e0; }
@keyframes divGlow { from { stroke-opacity: .3; fill-opacity: .25; } to { stroke-opacity: 1; fill-opacity: 1; } }
.engLine { stroke: #ffb300; stroke-width: 7; stroke-dasharray: 18 12; fill: none; pointer-events: none; }
.engBig { stroke: var(--accent); stroke-linecap: round; fill: none; opacity: .85; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawIn 1.5s ease-out forwards; pointer-events: none; }
.engBigHead { fill: var(--accent); opacity: 0; animation: fadeIn .3s 1.3s forwards; pointer-events: none; }
@keyframes drawIn { to { stroke-dashoffset: 0; } }
@keyframes fadeIn { to { opacity: .9; } }
/* fin de partie */
#endFx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.endTint { opacity: 0; animation: tint 2.5s 1s forwards; } @keyframes tint { to { opacity: .35; } }
.endArrow { stroke: var(--c); stroke-linecap: round; fill: none; opacity: .9; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawIn 2.6s cubic-bezier(.3,.1,.2,1) forwards; }
.endArrowHead { fill: var(--c); opacity: 0; animation: fadeIn .4s 2.4s forwards; }
.endBar { opacity: 0; transform-box: fill-box; transform-origin: center; animation: bar .5s 2.3s forwards, shake .12s 2.8s 6 alternate; } @keyframes bar { to { opacity: 1; } } @keyframes shake { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
.endClash { fill: #fff; opacity: 0; animation: clash .6s 2.4s forwards; } @keyframes clash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .25; } }
.endMud { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: mud 4s ease-in forwards; } @keyframes mud { to { transform: scaleY(.62); } }
.endRain { opacity: 0; animation: rain 1s forwards; } @keyframes rain { to { opacity: 1; } }
#boardBox > img, #boardBox > #svg { transition: filter 4s; } #boardBox.mudded > img, #boardBox.mudded > #svg { filter: sepia(.65) saturate(.55) brightness(.8); }
#endBanner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 6; min-width: min(560px, 90%); max-width: 92%; background: rgba(21,24,28,.92); color: #fff; border-radius: 14px; padding: 18px 22px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); animation: banner .6s 1.6s both; }
#endBanner .h { font: 900 34px system-ui, sans-serif; letter-spacing: .06em; } #endBanner .s { font-size: 17px; margin-top: 4px; }
#endBanner.won .h { color: #ffd400; } #endBanner.lost .h { color: #ff8a80; } #endBanner.k-mud { animation-delay: 2.6s; } #endBanner.k-mud .h { color: #d7b98a; }
#endBanner .cu { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 10px 0 4px; font-size: 15px; } #endBanner .cu .sum { border-left: 1px solid #666; padding-left: 16px; }
#endBanner .d { color: #c9ccd1; margin: 8px 0 10px; } #endBanner button { color: var(--ink); }

@media (prefers-reduced-motion: reduce) { .fxArea, .fxBox, .fxHit, .fxHitArea, .divGlow, .enEngBlink { animation: none; } .engBig, .endArrow { animation: none; stroke-dashoffset: 0; } .engBigHead, .endArrowHead, .endBar, .endClash, .endTint, .endRain, #endBanner { animation: none; opacity: 1; } .endTint { opacity: .35; } .endMud { animation: none; transform: scaleY(.62); } #boardBox > img, #boardBox > #svg { transition: none; } }
/* panneau */
aside { width: var(--asideW, 320px); min-width: 260px; max-width: 70vw; flex: none; position: relative; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

.slotsFree { border: 1.5px dashed var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); margin-bottom: 8px; font-size: 12.5px; text-align: center; }
.card { position: relative; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; background: #333 center / cover no-repeat; aspect-ratio: 16 / 9; }

.slotEmpty { border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); margin-bottom: 8px; font-size: 13px; }

.soloLob .nm { position: relative; flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 14px 10px 18px; border: 0; cursor: pointer; text-align: left; color: #f2eee0; background: rgba(18, 20, 16, .55);

<script>
// 9 nov. : mode solo (joueur.html?mode=solo) : pas de serveur, la partie vit dans ce navigateur (même arborescence que le duel)
(function () {
  let m = null; try { m = new URLSearchParams(location.search).get('mode'); } catch (e) {}
  if (m !== 'solo') return;
  window.RASP_SOLO = true;
  const pl = ((location.search.match(/[?&]plateau=(suwalki|focsani)(&|$)/i) || [])[1] || '').toLowerCase();
  const KEY = 'rasp-solo-partie' + (pl ? '-' + pl : '');   // une partie solo par plateau
  let DB = {}; try { DB = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { DB = {}; }
  const segs = p => String(p).split('/').filter(Boolean);
  const getP = p => segs(p).reduce((o, k) => (o == null ? null : (o[k] === undefined ? null : o[k])), DB);
  const setP = (p, v) => { const s = segs(p); if (!s.length) { DB = v == null ? {} : JSON.parse(JSON.stringify(v)); return; } let o = DB; for (const k of s.slice(0, -1)) { if (typeof o[k] !== 'object' || o[k] == null) o[k] = {}; o = o[k]; } if (v == null) delete o[s[s.length - 1]]; else o[s[s.length - 1]] = JSON.parse(JSON.stringify(v)); };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { console.warn('sauvegarde solo', e); } };
  const subs = [];
  const notify = () => { for (const s of subs) { const v = JSON.stringify(getP(s.p)); if (v !== s.last) { s.last = v; setTimeout(() => s.cb(v == null ? null : JSON.parse(v)), 0); } } };
  window.RASP_SOLO_CLEAR = () => { DB = {}; try { localStorage.removeItem(KEY); } catch (e) {} };
  // 10 nov. : la sauvegarde fichier du solo emporte toute la partie (arbitrage, ordres du bot, graine, historique) : reprise et 3A possibles
  window.RASP_SOLO_DUMP = () => JSON.parse(JSON.stringify(DB));
  window.RASP_SOLO_LOAD = v => { DB = JSON.parse(JSON.stringify(v || {})); persist(); };
  window.RN_BACKEND = {
    init: async () => 'anon:solo', anon: async () => 'solo', login: async () => {}, logout: async () => {},
    set: async (p, v) => { setP(p, v); persist(); notify(); },
    update: async u => { for (const k of Object.keys(u)) setP(k, u[k]); persist(); notify(); },
    get: async p => { const v = getP(p); return v == null ? null : JSON.parse(JSON.stringify(v)); },
    on: (p, cb) => { subs.push({ p, cb, last: undefined }); notify(); return () => {}; },
    onConn: cb => setTimeout(() => cb(true), 0),
  };
})();
</script>

  const tok = u => el('span', { class: 'tok' + (BIG.includes(u.type) ? ' big' : '') + (UI.sel === u.id ? ' sel' : '') + (u.neut >= T ? ' neut' : '') + (u.ghost ? ' ghost' : ''), title: u.type + (u.neut >= T ? ` · neutralisé → T${u.neut}` : ''), 'data-type': u.type, onclick: ev => { ev.stopPropagation(); unitClick(u); } }, el('img', { src: PION_IMG[u.type], alt: ABBR[u.type] }));
  const legal = legalTargets();
  const gp = el('div', { class: 'box' + (legal.has('Garde POW') || (UI.sel && canGuard()) ? ' target' : ''), onclick: () => sideClick('Garde POW') });
  gp.append(el('span', { class: 'tok fixed', title: "INF de garde d'office : il reste toujours au POW" }, el('img', { src: PION_IMG.INF, alt: 'INF' })));
  units.filter(u => u.slot === 'Garde POW' && !u.dead).forEach(u => gp.append(tok(u)));
  side.append(el('h3', { text: 'Garde du POW' }), gp, el('div', { class: 'small muted', text: `Jauge POW : ${S.pow}` }));
  const rs = el('div', { class: 'box' + (UI.sel && canReserve() ? ' target' : ''), onclick: () => sideClick('Réserve') });
  const inRes = units.filter(u => u.slot === 'Réserve' && !u.dead);
  const types = [...BIG, ...Object.keys(SMALL)].filter(t => inRes.some(u => u.type === t));
  for (const t of types) { const us = inRes.filter(u => u.type === t); const first = us.find(u => UI.sel === u.id) || us[0]; rs.append(el('div', { class: 'tg' }, tok(first), el('span', { class: 'small', text: t === 'ART CA' ? 'ART (CA)' : t }), el('span', { class: 'n', text: `× ${us.length}` }))); }
  if (!types.length) rs.append(el('span', { class: 'small muted', text: 'réserve vide' }));
  side.append(el('h3', { text: 'Réserve' }), rs);
  const dead = S.units.filter(u => u.dead); if (dead.length) side.append(el('h3', { text: 'Pertes' }), el('div', { class: 'small', text: countTypes(dead) }));
}
const nextInReserve = type => { const n = S.units.find(x => x.type === type && x.slot === 'Réserve' && !x.dead); return n ? n.id : null; };
const canGuard = () => { const u = S.units.find(x => x.id === UI.sel); return u && (u.type === 'INF' || u.type === 'MP') && (S.phase === 'deploy' || UI.mode === 'disp'); };
const canReserve = () => { const u = S.units.find(x => x.id === UI.sel); return u && !BIG.includes(u.type) && u.type !== 'ART DIV' && (S.phase === 'deploy' || UI.mode === 'disp'); };

// ------------------------------------------------------------------ clics
// TUTO-DEBUT : conseils du tutoriel (10 nov.) : au premier clic sur chaque pion au déploiement, sur « 2. Réseau LOG » et sur chaque carte en cours de partie, le conseiller (G2, G3…) donne un conseil, une seule fois par navigateur
const TUTO_TIPS = {"PC": {"g": "G3", "r": "Conduite", "t": "Il faut cacher notre PC là où l'ENI n'ira pas le chercher, et ne pas oublier de le fortifier !"}, "BSC": {"g": "G4", "r": "Logistique", "t": "La BSC ravitaillera les ART CA, EW et GAM jusqu'à 3 corridors au plus. Sa meilleure place est au centre mais c'est là que l'ENI la cherchera. N'oubliez pas de l'approvisionner avec un flux LOG !"}, "POW": {"g": "G9", "r": "Environnement", "t": "Attention, aucune carte ne déplace le POW : ce placement est définitif. Choisissez une région isolée, loin de la BSC, du PC et de la DIV+, car une évasion frappe sa région et toutes les régions voisines. Ajoutez au moins un MP à l'INF de garde dans la partie au-dessus de la réserve dès le déploiement : il faut un garde par tranche de 5 points de jauge."}, "DIV+": {"g": "G5", "r": "Planification", "t": "La DIV+ est l'arme de la décision : elle accumule du potentiel puis s'engage dans un fuseau. Plus elle est proche d'une entrée logistique (venue de l'extérieur) plus nous pourrons la faire grossir rapidement. Plus elle est proche d'un fuseau, plus facile ce sera de l'y engager. On pourra la déplacer en cours de partie !"}, "INF": {"g": "G3", "r": "Conduite", "t": "Au front, une INF ne pèse que 0,3 RAPFOR : son vrai rôle est de protéger le Rear contre ROHUM, Sabotage, Maquis, Embuscade et Raid aéro, et de garder les prisonniers. Mettez-les en priorité auprès de vos grands pions. Mettez 3 INF en réserve si vous voulez jouer un jour l'Assaut de la BP."}, "MP": {"g": "G9", "r": "Environnement", "t": "Un MP vaut +0,5 FM au front et protège une région contre ROHUM, Sabotage, Maquis et Embuscade. Il rend aussi plus sûres la Bascule de PC, la Bascule BSC et le Mouvement de la DIV, et garde le POW. Partagez vos 5 MP entre le front, la protection des grands pions et la garde des prisonniers."}, "CIMIC": {"g": "G9", "r": "Environnement", "t": "Un CIMIC vaut +0,5 FM à la division de son fuseau. Dans le Rear, il protège sa région contre Maquis de partisans, Intox L2I et OSINT. Deux MP ou CIMIC au front compensent le marqueur FM d'une division ENI."}, "DSA": {"g": "G3-3D", "r": "Feux", "t": "Le DSA protège sa région contre les drones, le renseignement aérien, le bombardement, le Raid aéro et l'Out of contact Attack ; dans un fuseau, il gêne aussi CAS et Engagement GAM ENI. Avec 5 DSA, vous ne couvrirez pas tout : protégez d'abord la BSC, le PC et la DIV+. Évitez de tous les regrouper, un SEAD ENI détruit tous les DSA d'une zone."}, "GEN": {"g": "G3-2D", "r": "Terrain", "t": "Le GEN ne travaille que dans le Rear, dans sa propre région. Posez-le là où sont vos grands pions : avec Travaux du GEN, il fortifiera leur emplacement 0, la meilleure protection du jeu. Un GEN dans la région de la BSC pourra aussi rouvrir ses corridors coupés avec Ouverture d'itinéraire."}, "ART CA": {"g": "G3-3D", "r": "Feux", "t": "L'ART CA doit être à 3 corridors au plus de la BSC pour être ravitaillée, sinon elle ne tire pas. Elle peut tirer sur tout le plateau mais chaque tir la révèle : dispersez vos ART CA dans le Rear pour limiter la contre-batterie."}, "EW": {"g": "G3", "r": "Conduite", "t": "Dans un fuseau, l'EW donne +0,5 RAPFOR et protège la division contre l'Écoute GE ENI. Il permet surtout Brouillage GE (+3 RAPFOR) et Écoute GE dans son fuseau. Comme l'ART CA, il doit rester à 3 corridors au plus de la BSC pour jouer ses cartes."}, "GAM": {"g": "G3", "r": "Conduite", "t": "Le GAM se pose dans une région du Rear et doit être ravitaillé par la BSC (3 corridors au plus). Il permet l'Engagement GAM, le renfort le plus rapide du corps (+3 RAPFOR le lendemain), le Raid aéro et l'Out of contact Attack. Pion unique et précieux : abritez-le près de la BSC, sous la protection d'un DSA. Chaque fois qu'il se fait neutraliser, notre jauge ALAT baisse d'un cran."}, "ART DIV": {"g": "G3-3D", "r": "Feux", "t": "Les ART DIV sont posées d'office et fortifiées : 2 par fuseau, +1 RAPFOR chacune à la division vers laquelle elles tirent. C'est l'artillerie qui décide le plus souvent du combat. Avec Renfort de feu, vous pourrez en faire pivoter vers un fuseau voisin pour y faire la différence."}, "Réseau LOG": {"g": "G4", "r": "Logistique", "t": "Le réseau logistique se construit depuis l'extérieur vers les unités qui vont consommer (BSC, DIV des fuseaux et DIV+). Vous avez 30 marqueurs LOG, 5 au plus par corridor, et tout flux entre par un corridor d'entrée (U1 à U4 ou E1 à E4) ; une région ne fait pas sortir plus qu'elle ne reçoit. Commencez par le minimum vital : 1 flux à la BSC et au moins 1 par fuseau, sinon la division perd 2 FM. Mettez le reste sur le fuseau de l'effort (1 flux = 1 RAPLOG) et sur la DIV+."}, "Renseignement SAT": {"g": "G2", "r": "Renseignement", "t": "Le satellite est la carte de tous les jours : 60 %, effet le lendemain, de retour en 3 jours, sans rien user. Utilisez-le pour trouver les grands pions ENI dans le Deep ou voir l'effort ENI dans un fuseau. Le renseignement décrit la situation au début du tour."}, "Renseignement drone": {"g": "G2", "r": "Renseignement", "t": "Le drone réussit plus souvent (70 %) et revient vite, mais un DSA sur l'objectif le fait tomber à 40 %. En cas d'échec, l'ENI sait ce que vous cherchiez. Préférez-le sur les zones où aucun DSA n'est connu."}, "ROHUM": {"g": "G2", "r": "Renseignement", "t": "Le ROHUM est le plus sûr (80 %) mais le plus lent : 4 jours avant l'effet. Il puise dans les forces spéciales, partagées avec Sabotage, Maquis, Embuscade et Raid aéro, et un échec en coûte un cran. Réservez-le aux régions sans INF ni MP probables."}, "Renseignement aérien": {"g": "G2", "r": "Renseignement", "t": "Le renseignement aérien use la jauge AAE dont dépendent SEAD, Bombardement et CAS. Un échec coûte un cran, et la jauge ne remonte qu'aux tours 10 et 20. À garder pour l'urgence, de préférence là où l'ENI n'a pas de DSA."}, "OSINT": {"g": "G2", "r": "Renseignement", "t": "L'OSINT renseigne une région du Deep sans rien user, mais elle ne réussit qu'une fois sur deux et agit en 4 jours. Un CIMIC ENI sur la région la fait tomber à 20 %. Lancez-la tôt sur une région suspecte pour préparer les frappes."}, "Ecoute GE": {"g": "G2", "r": "Renseignement", "t": "L'Écoute GE (80 %) révèle les pions ENI d'un fuseau, mais il faut un EW ami ravitaillé dans ce fuseau. Un EW ENI dans le fuseau la gêne. En cas d'échec, votre EW est repéré et pourrait même s'attirer les feux de l'artillerie."}, "SEAD": {"g": "G3-3D", "r": "Feux", "t": "Le SEAD détruit tous les DSA ENI d'une région ou d'un fuseau, et rend leurs pleines chances à CAS, Bombardement et Frappe drone. Jouez-le avant vos feux aériens : il agit au tout début de la phase Frappes. Un échec coûte un cran d'AAE."}, "Frappe drone": {"g": "G3-3D", "r": "Feux", "t": "La frappe drone atteint tout le plateau (70 %) et neutralise le pion visé, ou fait perdre 30 points à un grand pion. Un DSA sur l'objectif la fait tomber à 40 %. Vérifiez avec le G2 que le POW ENI n'est pas dans la zone : le frapper ruinerait le moral de vos divisions."}, "Frappe en profondeur": {"g": "G3-3D", "r": "Feux", "t": "C'est la frappe la plus sûre (80 %) et la plus rapide : effet le lendemain. Une seule carte peut faire tirer vos 3 ART CA en salve, chacune sur sa cible ou bien sur la même pour diminuer fortement le potentiel d'un PC, d'une BSC ou d'une DIV+. Chaque tir révèle l'ART CA : pensez à la déplacer ensuite."}, "Bombardement": {"g": "G3-3D", "r": "Feux", "t": "Le bombardement neutralise toute une région du Deep, pions et flux compris : sur la région de la BSC ENI, il coupe son réseau et lui fait perdre 30 %. Un DSA le fait tomber à 30 % : faites passer un SEAD avant. Il use l'AAE en cas d'échec et revient lentement (8 jours)."}, "Raid aéro": {"g": "G3", "r": "Conduite", "t": "Le Raid aéro détruit définitivement un pion réduit, mais il met 5 jours et un échec use à la fois l'ALAT et les FS. Il faut un GAM ravitaillé, et INF ou DSA sur l'objectif le gênent. À réserver pour les points critiques déjà affaiblis, il est sans effet sur un grand pion."}, "Out of contact Attack": {"g": "G3", "r": "Conduite", "t": "Les hélicoptères tirent à distance sur un emplacement du Deep (70 %, 2 jours) : un pion réduit est neutralisé, un grand pion subit les pertes d'un bombardement. Il faut un GAM ravitaillé, et l'action est toujours révélée. Attention au POW ENI, comme pour toute frappe."}, "Sabotage": {"g": "G3", "r": "Conduite", "t": "Le sabotage est la seule frappe des forces spéciales qui atteint un grand pion, et la fortification ne le réduit pas : −30 % pour un PC ou une BSC ENI repérés. Il agit en 3 jours, à 60 %. Un INF ou un MP sur l'objectif le fait tomber à 30 %."}, "Maquis de partisans": {"g": "G3", "r": "Conduite", "t": "Le maquis neutralise toute une région du Deep, ses pions et ses flux, et fait perdre 40 % à une BSC. Il est lent (7 jours) : lancez-le tôt sur la région de la BSC ENI. INF, MP ou CIMIC sur la région le gênent."}, "Embuscade": {"g": "G3", "r": "Conduite", "t": "L'embuscade coupe un corridor du Deep pendant 5 tours, et tout ce qui est en aval est privé de flux. C'est la coupure la plus rentable sur un corridor qui mène à la BSC ou à un fuseau ENI : demandez au G2 les corridors chargés. Un INF ou un MP dans l'une des deux zones reliées la gêne."}, "Intox L2I": {"g": "G9", "r": "Environnement", "t": "L'Intox L2I ne réussit que 3 fois sur 10, mais elle n'use aucun moyen. Jouée sur la région de la BSC ENI, elle la neutralise et lui fait perdre 20 %. Avec un CIMIC ENI sur la région, elle échoue à coup sûr."}, "Déception GE": {"g": "G3", "r": "Conduite", "t": "Votre EW simule un tir d'ART CA depuis un emplacement vide de sa zone. Toute contre-batterie ENI qui surveille la zone tire dans le vide et révèle son ART CA. Montez-la avec le G3-3D pour que votre propre contre-batterie la frappe ensuite."}, "Contre-batterie": {"g": "G3-3D", "r": "Feux", "t": "Une ART CA surveille une zone (fuseau ou région du Deep) et neutralise 8 fois sur 10 tout pion ENI qui s'y révèle en tirant ou en brouillant. Une seule carte peut placer plusieurs ART CA, chacune face à la zone de son choix, ou toutes sur la même pour multiplier les chances de toucher. Elle garde sa mission jusqu'à ce qu'elle bouge, reçoive une autre mission ou soit neutralisée. Gare à la Déception GE ENI, qui la fait tirer dans le vide pour la démasquer."}, "Assaut de la BP": {"g": "G5", "r": "Planification", "t": "Carte à usage unique : la brigade parachutiste neutralise une région du Deep, détruit ses pions réduits et fait perdre 50 % à un grand pion, même fortifié. Il faut 3 INF en réserve au tour d'effet, qui sont perdus, et toutes vos divisions perdent 2 FM cinq tours plus tard. Gardez-la pour un coup décisif, sur la BSC ou la DIV+ ENI."}, "Ordre à la DSA": {"g": "G3-3D", "r": "Feux", "t": "Indiquez la place voulue de chaque DSA, réserve comprise : seuls les pions que vous déplacez bougent. L'ordre agit en 2 jours. Déplacez vos DSA vers les zones que l'ENI semble viser, ou avant vos propres CAS si un fuseau est menacé."}, "Ordre à la B.ZARR": {"g": "G3", "r": "Conduite", "t": "Cet ordre déplace vos INF, EW et GAM en 2 jours, réserve et garde du POW comprises. Utilisez-le pour protéger une région menacée, renforcer la garde des prisonniers ou amener un EW dans un fuseau. Un emplacement 4 ou 5 non ouvert rend l'ordre inexécutable."}, "Ordre aux MP et CIMIC": {"g": "G9", "r": "Environnement", "t": "Une seule carte place tous vos MP et CIMIC : FM au front, protection du Rear et garde du POW. Surveillez la jauge POW : demandez un garde de plus avant de franchir le multiple de 5 suivant, puisque l'ordre met 2 jours. C'est la carte la plus utile du G9."}, "Ordre à la B.GEN": {"g": "G3-2D", "r": "Terrain", "t": "Cet ordre déplace vos GEN dans le Rear en 2 jours. Amenez-les là où se trouvent vos grands pions ou vos corridors exposés. Un GEN ne travaille que dans sa région."}, "Ordre à la B.ART": {"g": "G3-3D", "r": "Feux", "t": "Cet ordre déplace vos ART CA en 2 jours. Changez-les de place après une salve qui les a révélées, ou passez-en une dans un fuseau pour atteindre le Deep. Elles doivent rester à 3 corridors au plus de la BSC."}, "Travaux du GEN": {"g": "G3-2D", "r": "Terrain", "t": "Chaque GEN actif réalise un chantier dans sa région : fortifier un emplacement ou ouvrir l'emplacement 4 ou 5. Fortifiez d'abord l'emplacement 0 de la BSC, du PC et de la DIV+ : un grand pion fortifié ne perd que la moitié des points. La carte revient tous les 4 jours, jouez-la souvent."}, "Bascule de PC": {"g": "G3", "r": "Conduite", "t": "La bascule met le PC hors d'atteinte quand l'ENI semble l'avoir repéré, vers l'emplacement 0 libre de n'importe quelle région du Rear. Elle agit en 2 jours et la carte revient au bout de 4 jours. Avec un MP au départ ou à l'arrivée, elle réussit à 90 %, sinon à 60 %. En cas d'échec, le PC bouge quand même mais perd 30 %."}, "Bascule BSC": {"g": "G4", "r": "Logistique", "t": "La bascule déplace la BSC vers l'emplacement 0 libre d'une autre région (4 jours). Le réseau ne suit pas tout seul : préparez l'Ordre à la B.LOG qui l'accompagnera. Un MP au départ ou à l'arrivée la porte à 90 %, sinon la BSC perd 30 % en cas d'échec."}, "Mouvement de la DIV": {"g": "G5", "r": "Planification", "t": "Ce mouvement amène la DIV+ vers l'emplacement 0 libre de n'importe quelle région du Rear, idéalement celle qui touche le fuseau où vous voulez l'engager. Sans MP au départ ni à l'arrivée, la réussite tombe à 40 % et un échec lui coûte 30 points. Pensez ensuite à un Ordre à la B.LOG pour la nourrir."}, "Transfert à la justice": {"g": "G9", "r": "Environnement", "t": "Le transfert divise la jauge POW par deux et réduit le besoin de gardes. Il met 5 jours : anticipez-le dès que la jauge approche la capacité de votre garde. Ayez au moins autant de MP que d'INF dans la garde, sinon la réussite tombe à 50 %."}, "Ordre à la B.LOG": {"g": "G4", "r": "Logistique", "t": "Donnez le réseau complet voulu, pas le changement : il s'applique le lendemain. C'est la réponse rapide à une coupure ou le moyen de déplacer l'effort vers le fuseau décisif. Il est impossible si la jauge BSC est sous 50 %, et un réseau invalide fait perdre la carte."}, "Effort LOG": {"g": "G4", "r": "Logistique", "t": "L'Effort LOG (80 %, 5 jours) donne au choix +2 RAPLOG à une division pendant trois tours, ou +10 points à la DIV+. Coordonnez-le avec le G5 : lancé cinq jours avant l'effort, il pèse sur trois combats de suite dans le fuseau décisif, ou il accélère la montée en puissance de la DIV+ avant son engagement."}, "REMEC": {"g": "G4", "r": "Logistique", "t": "La REMEC (90 %, 5 jours, retour en 10 jours) répare une jauge touchée : au choix +3 crans ALAT en la jouant sur le GAM, +30 % au PC ou +30 % à la BSC. C'est le seul moyen de réparer vite ces jauges : gardez-la pour le pion le plus abîmé. Elle ne peut plus viser le GAM une fois celui-ci détruit."}, "Ouverture d'itinéraire": {"g": "G3-2D", "r": "Terrain", "t": "Le GEN désigné rouvre le lendemain tous les corridors coupés qui touchent sa région. C'est la parade à une Embuscade ENI. Il faut que le GEN soit toujours actif et à sa place au tour d'effet."}, "CAS": {"g": "G3-3D", "r": "Feux", "t": "L'appui aérien donne +3 RAPFOR à une division pour le combat du tour : c'est la carte qui décide le plus souvent du RAPFOR. Jouez-le deux jours avant le combat visé, avec le G3 et le G5. Un DSA ENI dans le fuseau le fait tomber à 30 %."}, "Engagement GAM": {"g": "G3", "r": "Conduite", "t": "Le GAM apporte +3 RAPFOR à une division dès le lendemain : c'est le renfort le plus rapide du corps. Il faut un GAM ravitaillé, et un DSA ENI dans le fuseau le gêne. Un échec coûte un cran d'ALAT."}, "Brouillage GE": {"g": "G3", "r": "Conduite", "t": "Le brouillage donne +3 RAPFOR le lendemain au fuseau où se trouve votre EW. Mais l'EW se révèle toujours : demandez au G2 si l'ENI fait de la contre-batterie sur ce fuseau. Un EW ENI dans le fuseau le gêne."}, "Effort COM": {"g": "G9", "r": "Environnement", "t": "L'Effort COM donne +1 FM à une division, sans risque, mais il faut le jouer 4 jours avant le combat visé. Il sert à faire basculer un critère FM serré sur le fuseau de l'effort. Il aide aussi à contrer un engagement de DIV+ ENI annoncé."}, "Renfort de feu": {"g": "G3-3D", "r": "Feux", "t": "Faites pivoter jusqu'à 2 ART DIV vers un fuseau voisin : elles y apportent leur +1 RAPFOR, que leur propre division perd. Prenez-les dans un fuseau calme pour les mettre là où le combat se décide. Le pivot dure : il faudra un autre Renfort de feu pour les ramener."}, "Engagement de la DIV": {"g": "G5", "r": "Planification", "t": "La DIV+ s'engage 3 jours plus tard dans le fuseau choisi : chaque tranche de 3 points de potentiel avance le front d'une case. Engagez-la là où le front vous est déjà favorable, car même pleine, elle ne perce pas seule depuis un front à 0. L'ENI est prévenu dès que la carte est jouée : protégez-la pendant ces 3 jours. Après le combat, la DIV+ vous envoie son compte rendu : les kilomètres gagnés (3 par case) et son estimation du front."}};
if (R.SUW) Object.assign(TUTO_TIPS, {"NAV":{"g":"G3","r":"Conduite","t":"Le NAV est la flottille que la marine nous a détachée : pion unique, il reste dans les régions côtières ou en réserve. Il lui faut un flux mineur pour être ravitaillé. Il permet de jouer toutes les cartes navales, et sa présence protège contre les actions navales adverses. Dans le Close, il donne +1 RAPFOR à notre division côtière. Seule la carte Appareillez ! le déplace. Chaque fois qu'il se fait neutraliser, notre jauge NAV perd un point : abritez-le sous la protection d'un DSA."},"Reco de plage":{"g":"G2","r":"Renseignement","t":"Les nageurs de combat renseignent une région côtière ENI ou la moitié ENI du fuseau de Kaliningrad (70 %, 4 jours, retour en 7 jours). C'est le meilleur moyen de trouver le NAV ENI ou de préparer un Raid amphibie. Un INF ou le NAV ENI sur la zone la gênent, et un échec coûte un point de jauge NAV."},"Commando marine":{"g":"G3","r":"Conduite","t":"Le commando détruit définitivement un pion réduit ENI en zone côtière, même fortifié : c'est l'arme pour couler le NAV ENI. Il agit en 5 jours, à 60 %, et un échec use à la fois la jauge NAV et les FS. Sans effet sur un grand pion. Un INF ou le NAV ENI sur l'objectif le gênent."},"Bombardement naval":{"g":"G3-3D","r":"Feux","t":"Le NAV bombarde un emplacement d'une région côtière du Deep ENI (70 %, 4 jours) : un pion réduit est neutralisé, un grand pion perd 30 points, la moitié s'il est fortifié. Attention au POW ENI, comme pour toute frappe. Un échec coûte un point de jauge NAV."},"Raid amphibie":{"g":"G5","r":"Planification","t":"Le raid amphibie est un débarquement qui neutralise toute une région côtière ENI. Il faut une INF en réserve au tour d'effet : en cas de succès, cette INF reste neutralisée 5 tours ; en cas d'échec, elle est détruite et la jauge NAV perd un point. Reconnaissez la plage avant, avec une Reco de plage, et mettez une INF en réserve au bon moment."},"Appareillez !":{"g":"G3","r":"Conduite","t":"C'est   const save = Object.assign({}, sv, { state: P.state, drafts: { B: '', R: '' }, excluded: { B: [], R: [] }, forced: {}, hist: (sv.hist || []).concat([rec]) });
  const u = { 'arbitre/sauvegarde': JSON.stringify(save), 'arbitre/tour': T + 1, [`arbitre/pub/${id}`]: 1 };
  for (const c of ['B', 'R']) u[`cr/${c}/${id}`] = { turn: T, rev: 1, text: P.text[c], at };
  await duelTry(u);
}
function duelReset() {
  ask('Nouvelle partie de duel ?', "La partie de duel en cours sera effacée pour les deux joueurs, et les deux pages repartiront au déploiement. Pensez à sauvegarder votre page dans un fichier avant.", async () => {
    if (await duelTry({ boite: null, cr: null, refus: null, arbitre: null, session: Date.now() })) return;
    ask('Nouvelle partie impossible', "Le serveur n'a pas répondu ou a refusé : vérifiez la connexion puis réessayez.", () => {});
  });
}
// ------------------------------------------------------------------ mode solo : contre un bot (9 nov. ; les deux camps depuis le 10 nov.)
// Tout se passe dans ce navigateur : le backend local (en tête de page) reprend l'arborescence du duel.
// Le joueur prend le camp choisi sur l'accueil (SO.camp) ; le bot joue l'autre : un chef russe contre les Bleus, un chef français contre les Rouges.
// Profils des bots : bots.js (classeur de Ben). Le bot ne lit de la partie que son propre camp et ses comptes rendus.
const SO = { box: {}, sv: undefined, busy: false, again: false, done: {}, info: null, api: null, camp: 'B' };
const soloBotCamp = () => SO.camp === 'R' ? 'B' : 'R';
const soloApi = () => SO.api || (SO.api = RaspBotCore(R, RASP_BOT_PROFILS));
function soloLabel() {
  const i = SO.info; if (!i) return 'Solo';
  const p = soloApi().list().find(x => x.id === i.id);
  const fini = SO.sv && SO.sv.state && SO.sv.state.ended;
  return 'Solo · contre ' + (i.surprise && !fini ? 'un adversaire surprise' : (p ? p.nom : i.id));
}
async function soloBoot() {
  try { await RN.init(); } catch (e) {}
  let info = null; try { info = await RN.get('solo'); } catch (e) {}
  SO.camp = WANT_CAMP || (info && info.camp) || 'B';
  // 10 nov. : l'adversaire se choisit sur l'accueil (index.html#solo-B ou #solo-R), qui ouvre joueur.html?mode=solo&camp=X&bot=id
  let want = null; try { want = new URLSearchParams(location.search).get('bot'); } catch (e) {}
  if (want) { try { history.replaceState(null, '', location.pathname + '?mode=solo&camp=' + SO.camp); } catch (e) {} return soloNew(want); }
  if (info && info.id && (info.camp || 'B') === SO.camp) { SO.info = info; netEnter(SO.camp); return; }
  location.replace('index.html#solo/' + PROUTE + '/' + SO.camp);
}
const SOLO_PORTRAITS = { popov: 1, boris: 1, ivan: 1, svietchine: 1, toukhatchevski: 1, gerasimov: 1, tchouikov: 1, rokossovski: 1, koniev: 1, joukov: 1 };   // portraits/<id>.gif (sans portrait : étoile rouge pour un russe, cocarde pour un français)
function soloLobby(msg) {
  document.documentElement.classList.add('noGame');
  document.body.className = ''; const st = $('#stage'); st.replaceChildren();
  const old = document.querySelector('.soloLob'); if (old) old.remove();
  const BC = soloBotCamp(), FR = BC === 'B', chefs = FR ? 'chefs français' : 'chefs russes';
  const bots = soloApi().list().filter(b => b.camp === BC).sort((a, b) => a.rang - b.rang)
    .map(b => ({ id: b.id, nom: b.nom, desc: b.desc, niv: b.niveau }));
  bots.push({ id: '?', nom: 'Adversaire surprise', desc: `Un des ${chefs}, tiré au hasard. Vous ne saurez lequel qu'à la fin de la partie.`, niv: 0 });
  const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  const STAR = '<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M24 4l5.9 13 14.1 1.6-10.5 9.6 2.9 14L24 35l-12.4 7.2 2.9-14L4 18.6 18.1 17z"/></svg>';
  let pick = null;
  const COC = '<svg class="coc" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#c9302c"/><circle cx="24" cy="24" r="15" fill="#f2eee0"/><circle cx="24" cy="24" r="8" fill="#2f5fb3"/></svg>';
  const col = el('div', { class: 'col', role: 'listbox', 'aria-label': (FR ? 'Chefs français' : 'Chefs russes') + ', du plus faible au plus fort' });
  const med = el('div', { class: 'med', 'aria-live': 'polite' });
  const items = bots.map((b, i) => el('button', { class: 'nm' + (b.id === '?' ? ' sur' : ''), role: 'option', 'aria-selected': 'false', onclick: () => choose(i) },
    el('span', { class: 't', text: b.nom }), el('span', { class: 'lv', text: b.niv ? stars(b.niv) : '?' })));
  col.append(...items);
  const ok = el('button', { class: 'ok', onclick: () => { if (pick) soloNew(pick.id); } }, "Valider l'adversaire");
  function show() {
    const por = el('div', { class: 'por' });
    if (!pick) { por.append(el('span', { class: 'q', text: '?' })); med.replaceChildren(por, el('p', { class: 'hint', text: `Choisissez un ${FR ? 'chef français dans la colonne de droite' : 'chef russe dans la colonne de gauche'}.` })); return; }
    if (pick.id === '?') por.append(el('span', { class: 'q', text: '?' }));
    else if (SOLO_PORTRAITS[pick.id]) por.append(el('img', { src: `portraits/${pick.id}.gif`, alt: 'Portrait de ' + pick.nom }));
    else por.innerHTML = FR ? COC : STAR;
    med.replaceChildren(por, el('div', { class: 't', text: pick.nom }), el('div', { class: 'lv', text: pick.niv ? stars(pick.niv) : '' }), el('p', { class: 'd', text: pick.desc }), ok);
  }
  function choose(i, focus) {
    pick = bots[i];
    items.forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-selected', String(j === i)); });
    items[i].scrollIntoView({ block: 'nearest' }); if (focus) items[i].focus();
    show();
  }
  col.addEventListener('keydown', e => {
    const i = pick ? bots.indexOf(pick) : -1;
    if (e.key === 'ArrowDown') { e.preventDefault(); choose(Math.min(bots.length - 1, i + 1), true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); choose(Math.max(0, i - 1), true); }
  });
  show();
  for (const id in SOLO_PORTRAITS) { const im = new Image(); im.src = `portraits/${id}.gif`; }   // préchargement
  document.body.append(el('div', { class: 'soloLob' + (FR ? ' fr' : '') }, el('div', { class: 'bg' }), el('div', { class: 'veil' }),
    el('div', { class: 'wrap' },
      el('h2', { text: 'Choisissez votre adversaire' }),
      col, med,
      el('div', { class: 'foot' }, el('a', { href: 'index.html#solo/' + PROUTE }, '‹ Changer de mode, de plateau ou de camp'), el('span', { class: 'err', text: msg || '' })))));
}
async function soloNew(id) {
  const lob = document.querySelector('.soloLob'); if (lob) lob.remove();
  const api = soloApi(); let surprise = false;
  if (id === '?') { const c = api.list().filter(b => b.cache && b.camp === soloBotCamp()); id = c[Math.floor(Math.random() * c.length)].id; surprise = true; }
  if (!api.list().some(b => b.id === id && b.camp === soloBotCamp())) return location.replace('index.html#solo/' + PROUTE + '/' + SO.camp);   // bot inconnu ou de l'autre camp
  const seed = 'solo-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36);
  SO.info = { id, seed, surprise, at: Date.now(), camp: SO.camp, plateau: R.PLATEAU };
  try { localStorage.removeItem('rasp-joueur-solo-v1-B' + PSFX); localStorage.removeItem('rasp-joueur-solo-v1-R' + PSFX); } catch (e) {}
  await RN.update({ solo: SO.info, session: Date.now(), boite: null, cr: null, refus: null, arbitre: null });
  netEnter(SO.camp);
}
function soloStart() {
  RN.on('solo', v => { if (v) SO.info = v; netLabel(); }, () => {});
  RN.on('boite/' + SO.camp, v => { SO.box = v || {}; soloTick(); }, () => {});
  RN.on('arbitre/sauvegarde', v => { try { SO.sv = v ? JSON.parse(v) : null; } catch (e) { SO.sv = null; } netLabel(); soloTick(); }, () => {});
}
async function soloTick() {
  if (SO.busy) { SO.again = true; return; }
  if (SO.sv === undefined || !SO.info) return;
  SO.busy = true;
  try { do { SO.again = false; await soloStep(); } while (SO.again); }
  catch (e) { console.warn('arbitrage solo', e); }
  finally { SO.busy = false; }
}
async function soloRefuse(turn, kind, motif) {
  const PC = SO.camp, id = RN.tid(turn), key = `${PC}${id}${SO.box[id].at}`; if (SO.done[key]) return; SO.done[key] = 1;
  await RN.update({ [`boite/${PC}/${id}`]: null, [`refus/${PC}/${id}`]: { turn, kind, motif, at: Date.now() } });
}
async function soloStep() {
  const sv = SO.sv, api = soloApi(), PC = SO.camp, BC = soloBotCamp();
  if (!sv || !sv.state) {   // début de partie : fiche du joueur et déploiement du bot
    const d = SO.box.T00; if (!d) return;
    const e = R.parseDeployment(R.newState(), PC, d.text).errs; if (e.length) return soloRefuse(0, 'deploy', e.join(' ; '));
    const bot = api.create(SO.info.id, SO.info.seed);
    const dep = { [PC]: d.text, [BC]: bot.deploy() };
    const out = R.setupGame(undefined, dep.B, dep.R);
    if (!out.ok) { if (out[PC] && out[PC].errs.length) return soloRefuse(0, 'deploy', out[PC].errs.join(' ; ')); console.warn('déploiement du bot refusé', out[BC] && out[BC].errs); return; }
    const save = { app: 'raspoutitsa-arbitrage', v: 1, mode: 'solo', bot: { id: SO.info.id, seed: SO.info.seed, mem: bot.mem, camp: BC }, state: out.state, drafts: { B: '', R: '' }, excluded: { B: [], R: [] }, forced: {}, hist: [], deploy: dep };
    await RN.update({ 'arbitre/sauvegarde': JSON.stringify(save), 'arbitre/tour': 1, [`boite/${BC}/T00`]: { turn: 0, kind: 'deploy', text: bot.deploy(), at: Date.now() } });
    return;
  }
  const st = sv.state; if (st.ended) return;
  const T = st.turn, id = RN.tid(T), mB = SO.box[id];
  if (!mB) return;
  const ch = R.checkOrders(st, PC, mB.text, null);
  const bad = ch.lines.filter(o => o.status === 'ignored');
  if (bad.length) {
    const motif = (ch.warns.filter(w => /tour|message/.test(w)).concat(bad.map(o => `ligne ${o.n} (${o.card || o.raw.card || '?'}) : ${o.errors.join(' ; ')}`))).join('\n') + '\nCorrigez puis renvoyez les ordres.';
    return soloRefuse(T, 'orders', motif);
  }
  const bot = api.create(sv.bot.id, sv.bot.seed, sv.bot.mem);
  const txtR = bot.orders(st);   // ordres du bot (camp BC)
  const drafts = { [PC]: mB.text, [BC]: txtR }, excluded = { B: [], R: [] };
  const P = R.resolveTurn(st, drafts, excluded, {});
  bot.observe(P, st);
  const at = Date.now();
  const rec = { turn: T, drafts, excluded, forced: {}, text: P.text, savedAt: new Date(at).toISOString() };   // sans l'état d'avant : la sauvegarde reste légère
  const save = Object.assign({}, sv, { state: P.state, bot: Object.assign({}, sv.bot, { mem: bot.mem }), hist: (sv.hist || []).concat([rec]) });
  await RN.update({ 'arbitre/sauvegarde': JSON.stringify(save), 'arbitre/tour': T + 1, [`boite/${BC}/${id}`]: { turn: T, kind: 'orders', text: txtR, at }, [`cr/B/${id}`]: { turn: T, rev: 1, text: P.text.B, at }, [`cr/R/${id}`]: { turn: T, rev: 1, text: P.text.R, at } });
}
function soloReset() {
  ask('Nouvelle partie en solo ?', "La partie en cours contre le bot sera effacée, et vous choisirez de nouveau votre adversaire sur l'accueil. Pensez à sauvegarder votre page dans un fichier avant.", () => {
    try { localStorage.removeItem(STORE); } catch (e) {}
    if (window.RASP_SOLO_CLEAR) window.RASP_SOLO_CLEAR();
    location.replace('index.html#solo/' + PROUTE + '/' + SO.camp);   // 10 nov. : nouveau choix de l'adversaire sur l'accueil
  });
}
function netWatch() {
  RN.onConn(v => { NET.conn = v; netLabel(); });
  RN.on('session', netSession, () => {});
  RN.on('cr/' + NET.camp, v => { NET.crs = v || {}; if (S) { if (netPending()) UI.tab = 'phase'; refresh(); } }, () => {});
  RN.on('refus/' + NET.camp, netRefus, () => {});
}
function netEnter(camp) {
  NET.camp = camp; STORE = (RN.mode === 'solo' ? 'rasp-joueur-solo-v1-' : RN.mode === 'duel' ? 'rasp-joueur-duel-v1-' + RN.room + '-' : 'rasp-joueur-v1-') + camp + PSFX;
  S = load(); if (S && S.camp === camp) start(); else begin(camp);
  netWatch();
  if (RN.mode === 'duel') duelStart();
  if (RN.mode === 'solo') soloStart();
}
function netLogin(msg) {
  document.documentElement.classList.add('noGame');
  document.body.className = ''; const st = $('#stage'); st.replaceChildren();
  const pwd = el('input', { type: 'password', placeholder: 'Mot de passe du camp', style: 'width:100%;padding:10px;margin:8px 0;box-sizing:border-box' });
  const err = el('div', { class: 'small', style: 'color:var(--err)', text: msg || '' });
  const go = async camp => { err.textContent = 'Connexion…'; try { await RN.login(camp, pwd.value); err.textContent = ''; netEnter(camp); } catch (e) { err.textContent = 'Connexion refusée : vérifiez le camp et le mot de passe, ainsi que la connexion Internet.'; } };
  st.append(el('div', { class: 'welcome' }, el('h2', { text: RN.mode === 'duel' ? 'Connexion au duel' : 'Connexion du CMI' }), el('p', { text: RN.mode === 'duel' ? (WANT_CAMP ? 'Mode duel, sans arbitre humain : saisissez le mot de passe duel de votre camp.' : 'Mode duel, sans arbitre humain : saisissez le mot de passe duel de votre camp, puis choisissez ce camp.') : (WANT_CAMP ? 'Saisissez le mot de passe de votre camp.' : 'Saisissez le mot de passe de votre camp, puis choisissez ce camp.') }), pwd,
    el('div', { class: 'campPick' }, WANT_CAMP === 'R' ? null : el('button', { class: 'B', onclick: () => go('B') }, WANT_CAMP ? 'Se connecter : Bleus' : 'Bleus'), WANT_CAMP === 'B' ? null : el('button', { class: 'R', onclick: () => go('R') }, WANT_CAMP ? 'Se connecter : Rouges' : 'Rouges')), err,
    WANT_CAMP ? el('p', { class: 'small' }, el('a', { href: 'index.html' + (RN.mode === 'duel' ? '#duel' : '#wargame') }, '‹ Changer de mode ou de camp')) : null));
}
// 8 nov. : camp choisi sur la page d'accueil (joueur.html?camp=B ou R)
const WANT_CAMP = (() => { try { const c = new URLSearchParams(location.search).get('camp'); return c === 'B' || c === 'R' ? c : null; } catch (e) { return null; } })();
async function netBoot() {
  if (RN.mode === 'solo') return soloBoot();
  if (RN.mode === 'duel') return duelBoot();
  let role = null; try { role = await RN.init(); } catch (e) {}
  if ((role === 'B' || role === 'R') && (!WANT_CAMP || role === WANT_CAMP)) netEnter(role);
  else { if (role) try { await RN.logout(); } catch (e) {} netLogin(); }
}
if (RN.active) netBoot();
else {
S = load();
if (S && S.camp) start(); else welcome();
}
