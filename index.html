<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raspoutitsa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="accueil.jpg" as="image">
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raspoutitsa">
<style>
@font-face { font-family: "Black Ops One"; src: url("polices/black-ops-one.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Stardos Stencil"; font-weight: 700; src: url("polices/stardos-stencil-700.woff2") format("woff2"); font-display: swap; }
:root {
  --khaki: #d8cfa8; --khaki-dim: rgba(216, 207, 168, .55); --ink: #f2eee0;
  --panel: rgba(22, 26, 20, .62); --panel-hover: rgba(38, 44, 30, .78);
  --blue: #2f6fd6; --red: #c9302c;
  --zoom: 1.75; --zoom-x: 50%; --zoom-y: 47%;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #14171a; color: var(--ink); overflow: hidden; }
body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

/* fond : l'image, puis le zoom quand on entre dans un mode */
.bg { position: fixed; inset: 0; background: #14171a url("accueil.jpg") center / cover no-repeat; transform-origin: var(--zoom-x) var(--zoom-y); transition: transform 1.5s cubic-bezier(.65, 0, .25, 1), filter 1.5s ease; will-change: transform; }
.veil { position: fixed; inset: 0; pointer-events: none; transition: background 1.2s ease;
  background: radial-gradient(ellipse 46% 60% at 50% 55%, rgba(10, 12, 10, .55), rgba(10, 12, 10, 0) 70%), linear-gradient(to bottom, rgba(8, 10, 12, .78) 0%, rgba(8, 10, 12, .15) 26%, rgba(8, 10, 12, 0) 60%, rgba(8, 10, 12, .55) 100%); }
body.in .bg { transform: scale(var(--zoom)); filter: saturate(1.1) contrast(1.05); }
body.in .veil { background: radial-gradient(ellipse 60% 70% at 50% 52%, rgba(8, 10, 8, .62), rgba(8, 10, 8, .25) 75%), linear-gradient(to bottom, rgba(8, 10, 12, .7), rgba(8, 10, 12, .2) 30%, rgba(8, 10, 12, .55)); }
body.go .bg { transform: scale(calc(var(--zoom) * 1.35)); transition-duration: .7s; }
.black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease .1s; }
body.go .black { opacity: 1; }

/* écrans */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); transition: opacity .6s ease, transform .9s cubic-bezier(.65, 0, .25, 1); }
#home { justify-content: flex-start; }
body.in #home { opacity: 0; transform: scale(1.25); pointer-events: none; }
#camp { justify-content: center; opacity: 0; transform: scale(.9); pointer-events: none; }
body.in #camp { opacity: 1; transform: none; pointer-events: auto; transition-delay: .75s; }
body.go #camp { opacity: 0; transition-delay: 0s; }

h1 { margin: clamp(8px, 4vh, 40px) 0 0; font: 400 clamp(40px, min(10vw, 15vh), 132px)/1 "Black Ops One", Impact, "Arial Black", sans-serif; letter-spacing: .06em; text-align: center; color: var(--ink);
  text-shadow: 0 2px 0 #000, 0 0 18px rgba(0, 0, 0, .85), 0 0 46px rgba(0, 0, 0, .6); }
.sub { margin: clamp(4px, 1.2vh, 12px) 0 0; font: 700 clamp(15px, min(2.6vw, 4.2vh), 30px)/1.15 "Stardos Stencil", "Black Ops One", Impact, sans-serif; letter-spacing: .14em; text-transform: uppercase; text-align: center; color: var(--khaki); text-shadow: 0 1px 0 #000, 0 0 12px rgba(0, 0, 0, .9); }

.modes { margin: auto 0; display: flex; flex-direction: column; gap: clamp(8px, 2vh, 16px); width: min(430px, 46vw); min-width: 280px; }
.btn { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: clamp(9px, 2.1vh, 16px) 20px; border: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: none; font: inherit;
  background: var(--panel); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  box-shadow: inset 0 0 0 2px var(--khaki-dim); transition: background .2s, box-shadow .2s, transform .2s; }
.btn::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--khaki); opacity: .8; transition: width .2s; }
.btn:hover, .btn:focus-visible { background: var(--panel-hover); box-shadow: inset 0 0 0 2px var(--khaki); transform: translateX(4px); outline: none; }
.btn:hover::after, .btn:focus-visible::after { width: 9px; }
.btn .ic { flex: none; width: clamp(30px, 5.5vh, 40px); height: clamp(30px, 5.5vh, 40px); color: var(--khaki); }
.btn .t { display: block; font: 400 clamp(19px, min(2.4vw, 4.4vh), 27px)/1.05 "Black Ops One", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.btn .d { display: block; margin-top: 3px; font-size: clamp(12px, 2.1vh, 14px); color: #cfcab8; }
.btn .tag { margin-left: auto; flex: none; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 5px 7px; border: 1px solid var(--khaki-dim); color: var(--khaki); }
.btn[aria-disabled="true"] { cursor: default; opacity: .62; }
.btn[aria-disabled="true"]:hover { transform: none; background: var(--panel); box-shadow: inset 0 0 0 2px var(--khaki-dim); }

/* choix du camp */
.ct { font: 400 clamp(26px, min(4.4vw, 8vh), 54px)/1 "Black Ops One", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; text-align: center; text-shadow: 0 2px 0 #000, 0 0 20px rgba(0, 0, 0, .9); margin: 0; }
.cs { margin: clamp(4px, 1.4vh, 12px) 0 clamp(12px, 4vh, 34px); font: 700 clamp(13px, min(1.9vw, 3.6vh), 20px)/1.2 "Stardos Stencil", Impact, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--khaki); text-align: center; text-shadow: 0 1px 0 #000, 0 0 10px #000; }
.camps { display: flex; gap: clamp(12px, 3vw, 34px); justify-content: center; flex-wrap: wrap; }
.camp { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: clamp(150px, 22vw, 250px); padding: clamp(14px, 3.4vh, 28px) 14px; text-align: center; color: #fff; text-decoration: none; cursor: pointer;
  background: rgba(14, 18, 24, .62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); box-shadow: inset 0 0 0 2px var(--c), inset 0 -60px 60px -40px var(--c); transition: transform .2s, box-shadow .2s, background .2s; }
.camp:hover, .camp:focus-visible, .camp.hot { transform: translateY(-4px); background: rgba(14, 18, 24, .8); box-shadow: inset 0 0 0 3px var(--c), inset 0 -90px 70px -40px var(--c); outline: none; }
.camp.B { --c: var(--blue); } .camp.R { --c: var(--red); } .camp.A { --c: #8c8f88; }
/* 11 nov. : choix du plateau (avant le camp) et entrée du mode duel */
.camp.UA { --c: #b8963a; } .camp.SU { --c: #2c8c9c; } .camp.CR, .camp.RJ { --c: #8c8f88; }
.camp .tg { margin-top: 2px; font: 700 10px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 4px 6px; border: 1px solid var(--c); color: #fff; }
.cs .pl { color: #fff; }
.camp.UA .n, .camp.SU .n, .camp.CR .n, .camp.RJ .n { font-size: clamp(18px, min(2.3vw, 4.4vh), 26px); line-height: 1.1; }
.code { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: clamp(16px, 3.4vh, 28px) clamp(16px, 3vw, 30px); background: rgba(14, 18, 24, .7); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 2px #8c8f88;
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
.code label { font: 400 18px/1 "Black Ops One", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
.code .row { display: flex; gap: 10px; }
.code input { width: 9.5ch; padding: 10px 12px; font: 400 26px/1 "Black Ops One", Impact, monospace; letter-spacing: .22em; text-transform: uppercase; text-align: center; color: #fff; background: rgba(0, 0, 0, .45); border: 0; box-shadow: inset 0 0 0 1px var(--khaki-dim); }
.code input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--khaki); }
.code button { padding: 0 18px; border: 0; cursor: pointer; color: var(--ink); font: 400 17px/1 "Black Ops One", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; background: var(--panel); box-shadow: inset 0 0 0 2px var(--khaki-dim); }
.code button:hover, .code button:focus-visible { background: var(--panel-hover); outline: none; }
.code .err { min-height: 1.2em; margin: 0; font-size: 12px; color: #ffcf8f; }
.camp .n { font: 400 clamp(22px, min(3.2vw, 6vh), 36px)/1 "Black Ops One", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
.camp .u { font-size: clamp(12px, 2.2vh, 14px); color: #dcd8cc; }
.camp .fl { width: clamp(34px, 7vh, 52px); height: clamp(34px, 7vh, 52px); color: var(--c); filter: drop-shadow(0 0 6px rgba(0, 0, 0, .8)); }
.camps.three .camp { width: clamp(140px, 19vw, 220px); }
.camp.off { cursor: default; opacity: .5; } .camp.off:hover { transform: none; background: rgba(14, 18, 24, .62); box-shadow: inset 0 0 0 2px var(--c); }
.reprise { display: none; margin: 8px 0 0; padding: 2px 6px; background: none; border: 0; font: inherit; font-size: 12px; color: #e4dfcf; text-decoration: underline; text-underline-offset: 3px; text-shadow: 0 1px 3px #000; cursor: pointer; opacity: .85; }
.reprise:hover, .reprise:focus-visible { opacity: 1; color: #fff; }
body.solo:not(.bot) .reprise { display: inline-block; }
.repriseErr { display: none; max-width: 460px; margin: 4px 0 0; font-size: 12px; text-align: center; color: #ffcf8f; text-shadow: 0 1px 3px #000; }
body.solo:not(.bot) .repriseErr:not(:empty) { display: block; }
.note { white-space: pre-line; max-width: 560px; margin: clamp(10px, 3vh, 24px) 0 0; font-size: clamp(12px, 2.1vh, 14px); text-align: center; color: #e4dfcf; text-shadow: 0 1px 3px #000; }
.back { z-index: 2; position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 9px 14px 9px 12px; border: 0; cursor: pointer; color: var(--ink); font: 400 15px/1 "Black Ops One", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; background: var(--panel); box-shadow: inset 0 0 0 1px var(--khaki-dim); }
.back:hover, .back:focus-visible { background: var(--panel-hover); outline: none; }


/* 12 nov. : choix du plateau sur une carte de l'Europe en traits de lumière, un cadre par plateau */
.carte { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
body.surcarte .carte { opacity: 1; pointer-events: auto; transition-delay: .6s; }
body.surcarte .veil { background: radial-gradient(ellipse 75% 75% at 55% 50%, rgba(4, 8, 12, .7), rgba(4, 8, 12, .45) 80%), linear-gradient(to bottom, rgba(4, 8, 12, .75), rgba(4, 8, 12, .15) 28%, rgba(4, 8, 12, .2) 70%, rgba(4, 8, 12, .8)); }
.carte .co { fill: none; stroke: #ffe9b0; stroke-width: 1.3; stroke-linejoin: round; opacity: .85; filter: url(#lueur); }
.carte .fr { fill: none; stroke: #ffe9b0; stroke-width: .8; stroke-dasharray: 3 3; opacity: .45; }
.carte .zone { cursor: pointer; outline: none; }
.carte .zone polygon { fill: color-mix(in srgb, var(--c) 10%, transparent); stroke: var(--c); stroke-width: 2.4; stroke-dasharray: 10 6; filter: url(#lueur); transition: fill .25s, stroke-width .25s; }
.carte .zone text { font: 400 22px/1 "Black Ops One", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; fill: #fff; paint-order: stroke; stroke: rgba(0, 0, 0, .85); stroke-width: 5px; text-anchor: middle; }
.carte .zone text.s { font: 700 12px/1 system-ui, sans-serif; letter-spacing: .14em; fill: var(--c); }
.carte .zone:hover polygon, .carte .zone:focus-visible polygon, .carte .zone.hot polygon { fill: color-mix(in srgb, var(--c) 28%, transparent); stroke-width: 3.4; }
.carte .zone.UA { --c: #e0b44a; } .carte .zone.SU { --c: #4fd0e0; } .carte .zone.FO { --c: #ef7d5a; }
body.surcarte #camp { justify-content: flex-start; pointer-events: none; }
body.surcarte #camp > * { pointer-events: auto; }
body.surcarte #camp .ct { margin-top: clamp(8px, 4vh, 40px); }
body.surcarte #camp .camps { margin-top: auto; gap: 12px; }
body.surcarte #camp .camp { width: auto; min-width: 180px; flex-direction: row; gap: 10px; padding: 10px 16px; }
body.surcarte #camp .camp .fl { width: 30px; height: 30px; }
body.surcarte #camp .camp .u { display: none; }
body.surcarte #camp .note { margin-top: auto; }

/* 10 nov. : mode solo, choix de l'adversaire sur l'accueil (zoom sur le chef adverse : russe à droite, français à gauche) */
body.bot .bg { transform: scale(2.1); }
body.bot .veil { background: linear-gradient(to right, rgba(6, 8, 8, .9) 0%, rgba(6, 8, 8, .6) 34%, rgba(6, 8, 8, .12) 62%, rgba(6, 8, 8, .45) 100%), linear-gradient(to bottom, rgba(6, 8, 8, .55), rgba(6, 8, 8, 0) 30%, rgba(6, 8, 8, .5)); }
body.bot.fr .veil { background: linear-gradient(to left, rgba(6, 8, 8, .9) 0%, rgba(6, 8, 8, .6) 34%, rgba(6, 8, 8, .12) 62%, rgba(6, 8, 8, .45) 100%), linear-gradient(to bottom, rgba(6, 8, 8, .55), rgba(6, 8, 8, 0) 30%, rgba(6, 8, 8, .5)); }
body.bot #camp { opacity: 0; transform: scale(1.1); pointer-events: none; transition-delay: 0s; }
#bot { --kh: #d8cfa8; --khd: rgba(216, 207, 168, .5); --acc: #c9302c; opacity: 0; pointer-events: none; display: grid; align-items: stretch;
  grid-template-columns: minmax(230px, 330px) 1fr minmax(300px, 420px); grid-template-rows: auto 1fr auto; gap: 0 clamp(16px, 3vw, 40px); padding: max(16px, env(safe-area-inset-top)) clamp(16px, 4vw, 56px) max(16px, env(safe-area-inset-bottom)); }
body.bot #bot { opacity: 1; pointer-events: auto; transition-delay: .7s; }
body.go #bot { opacity: 0; transition-delay: 0s; }
body.fr #bot { --acc: #3b74d6; grid-template-columns: minmax(300px, 420px) 1fr minmax(230px, 330px); }
#bot h2 { grid-column: 1 / -1; margin: 0 0 clamp(10px, 2.5vh, 24px); padding-left: 96px; font: 400 clamp(22px, 3.4vw, 40px)/1.05 "Black Ops One", Impact, sans-serif; letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 2px 0 #000, 0 0 18px rgba(0, 0, 0, .8); }
#bot h2 small { display: block; margin-top: 6px; font: 700 clamp(12px, 1.5vw, 16px)/1.2 "Stardos Stencil", Impact, sans-serif; letter-spacing: .14em; color: var(--kh); }
#bot .col { grid-column: 1; grid-row: 2; min-height: 0; overflow-y: auto; scroll-behavior: smooth; padding: 4px 8px 4px 2px; display: flex; flex-direction: column; gap: 6px;
  mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%); }
body.fr #bot .col { grid-column: 3; } body.fr #bot .med { grid-column: 1; }
#bot .nm { position: relative; flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 14px 10px 18px; border: 0; cursor: pointer; text-align: left; color: #f2eee0; background: rgba(18, 20, 16, .55); font: inherit;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); box-shadow: inset 0 0 0 1px rgba(216, 207, 168, .25); transition: background .2s, transform .2s, box-shadow .2s; }
#bot .nm::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kh); opacity: .35; transition: opacity .2s, width .2s, background .2s; }
#bot .nm .t { font: 400 clamp(17px, 1.9vw, 22px)/1.1 "Black Ops One", Impact, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
#bot .nm .lv { font-size: 12px; letter-spacing: 1px; color: var(--kh); opacity: .75; white-space: nowrap; }
#bot .nm:hover, #bot .nm:focus-visible { background: rgba(38, 42, 30, .75); transform: translateX(4px); outline: none; }
#bot .nm.on { background: rgba(80, 18, 16, .78); box-shadow: inset 0 0 0 2px var(--acc); transform: translateX(8px); }
body.fr #bot .nm.on { background: rgba(16, 34, 84, .78); }
#bot .nm.on::before { background: var(--acc); opacity: 1; width: 7px; }
#bot .nm.sur .t, #bot .nm.cur .t { color: var(--kh); }
#bot .nm.cur { box-shadow: inset 0 0 0 1px var(--kh); }
#bot .med { grid-column: 3; grid-row: 2; align-self: center; min-height: 0; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: clamp(14px, 2.4vh, 26px) clamp(14px, 2vw, 24px); background: rgba(0, 0, 0, .86); border-radius: 22px; box-shadow: 0 0 0 1px var(--khd), 0 18px 50px rgba(0, 0, 0, .7); overflow-y: auto; }
#bot .por { flex: none; width: clamp(150px, min(26vh, 22vw), 250px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #000; display: grid; place-items: center; box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--kh), 0 0 30px color-mix(in srgb, var(--acc) 40%, transparent); }
#bot .por img { width: 100%; height: 100%; object-fit: cover; }
#bot .por .q { font: 400 clamp(70px, 10vh, 110px)/1 "Black Ops One", Impact, sans-serif; color: var(--kh); }
#bot .med .t { font: 400 clamp(22px, 2.6vw, 32px)/1 "Black Ops One", Impact, sans-serif; letter-spacing: .05em; text-transform: uppercase; text-align: center; }
#bot .med .lv { margin-top: -6px; color: #c9a227; letter-spacing: 3px; font-size: 18px; }
#bot .med .d { margin: 0; font-size: 15px; line-height: 1.45; text-align: center; color: #e8e2cc; font-style: italic; }
#bot .med .hint { margin: 0; text-align: center; color: var(--kh); opacity: .8; }
#bot .med .warn { margin: 0; font-size: 13px; text-align: center; color: #ffcf8f; }
#bot .ok { flex: none; margin-top: 4px; padding: 12px 26px; border: 0; cursor: pointer; color: #fff; background: var(--acc); font: 400 18px/1 "Black Ops One", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: filter .2s, transform .2s; }
#bot .ok:hover, #bot .ok:focus-visible { filter: brightness(1.15); transform: scale(1.03); outline: none; }
@media (max-width: 720px) {
  #bot { grid-template-columns: minmax(120px, 38%) 1fr; gap: 0 12px; padding-left: 16px; padding-right: 16px; }
  body.fr #bot { grid-template-columns: 1fr minmax(120px, 38%); }
  body.fr #bot .col { grid-column: 2; } body.fr #bot .med { grid-column: 1; } #bot .med { grid-column: 2; align-self: start; padding: 14px 12px; gap: 9px; border-radius: 16px; }
  #bot h2 { padding-left: 84px; }
  #bot .por { width: min(150px, 40vw); }
  #bot .nm { padding: 9px 8px 9px 13px; flex-direction: column; gap: 2px; }
  #bot .nm .t { font-size: 13.5px; letter-spacing: .02em; overflow-wrap: anywhere; }
  #bot .med .t { font-size: 19px; } #bot .med .d { font-size: 13.5px; } #bot .ok { padding: 11px 16px; font-size: 15px; }
}
@media (max-height: 480px) { #bot .por { width: min(110px, 26vh); } #bot .med .d { font-size: 12.5px; } }

/* téléphone en paysage : tout tient en hauteur */
@media (max-height: 480px) {
  h1 { margin-top: 2px; }
  .modes { width: min(400px, 52vw); }
  .btn .d { display: none; }
}
@media (max-width: 560px) {
  .modes { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .bg, .screen, .veil, .black { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

  <div class="col" id="botCol" role="listbox"></div>
  <div class="med" id="botMed"></div>
</section>
<div class="black" aria-hidden="true"></div>
<script src="bots.js?v=202611131300"></script>

<script>
(() => {
  const FLAG = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M10 44V5"/><path d="M10 7h26l-6 8 6 8H10" fill="currentColor" fill-opacity=".35"/></svg>';
  const STAR = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M24 5l5.6 12.4L43 19l-10 9.2L35.8 42 24 35.2 12.2 42 15 28.2 5 19l13.4-1.6z" fill="currentColor" fill-opacity=".35"/></svg>';
  const SCALE = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M24 6v36M14 42h20M8 14h32M8 14l-5 12h10zM40 14l-5 12h10z"/></svg>';
  // 11 nov. : le plateau se choisit avant le camp. Sans paramètre « plateau », les pages joueur et arbitre gardent le front ukrainien.
  const ANCHOR = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="24" cy="9" r="4"/><path d="M24 13v29M15 21h18M8 28c2 8 9 14 16 14s14-6 16-14"/><path d="M8 28l-3 4M8 28l4 2M40 28l3 4M40 28l-4 2"/></svg>';
  const FIELDS = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 11l12-5 14 5 12-5v31l-12 5-14-5-12 5z" fill="currentColor" fill-opacity=".2"/><path d="M17 6v31M31 11v31"/></svg>';
  const PLUS = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><rect x="7" y="7" width="34" height="34" rx="3"/><path d="M24 15v18M15 24h18"/></svg>';
  const KEY = '<svg class="fl" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="15" cy="24" r="8"/><path d="M23 24h20M37 24v7M31 24v5"/></svg>';
  const PLATEAUX = {
    ukraine: { cl: 'UA', n: 'Front ukrainien', u: '', ic: FIELDS, q: '' },
    suwalki: { cl: 'SU', n: 'Trouée de Suwałki', u: '', ic: ANCHOR, q: 'plateau=suwalki' },
    focsani: { cl: 'FO', n: 'Porte de Focșani', u: '', ic: ANCHOR, q: 'plateau=focsani' },   // 12 nov. : Roumanie, Moldavie, Ukraine, avec la mer Noire
  };
  const ZONES_CARTE = {"frames": {"ukraine": "305,29 320,26 335,23 349,20 364,17 379,14 394,11 408,7 423,4 438,0 452,-4 467,-8 481,-12 496,-16 510,-20 525,-25 539,-29 554,-34 568,-39 582,-43 596,-49 591,-63 586,-77 581,-92 576,-106 570,-121 565,-135 560,-149 555,-164 550,-178 545,-193 532,-188 519,-184 506,-179 492,-175 479,-171 466,-167 453,-163 440,-159 426,-155 413,-152 400,-148 386,-145 373,-142 360,-139 346,-136 333,-133 319,-130 306,-127 292,-125 279,-122 281,-107 284,-92 286,-77 289,-62 292,-47 294,-32 297,-17 300,-2 302,13", "suwalki": "-74,-103 -55,-102 -36,-102 -17,-102 2,-101 21,-102 39,-102 58,-102 77,-103 96,-104 115,-106 133,-107 152,-109 171,-111 190,-113 208,-115 227,-118 246,-120 264,-123 283,-126 301,-130 297,-153 293,-175 288,-198 284,-221 280,-244 275,-267 271,-290 267,-313 262,-336 258,-359 242,-356 226,-353 210,-350 194,-348 178,-346 162,-344 146,-342 130,-340 114,-339 98,-338 82,-337 66,-336 50,-335 34,-335 18,-334 1,-334 -15,-334 -31,-335 -47,-335 -63,-336 -64,-312 -65,-289 -66,-266 -67,-242 -68,-219 -69,-196 -70,-173 -71,-149 -73,-126", "focsani": "113,85 246,-108 375,-19 242,174"}, "lbl": {"ukraine": [455, 10], "suwalki": [97, -348], "focsani": [231, 41]}, "vb": [-796, -538, 1592, 990]};   // cadres des plateaux sur la carte (projection conique de Lambert)
  const withP = (url, P) => { const q = PLATEAUX[P].q; return q ? url + (url.includes('?') ? '&' : '?') + q : url; };
  const MODES = {
    wargame: { sub: 'Mode wargame', note: "L'arbitre ouvre la partie depuis son poste. Chaque CMI se connecte avec le mot de passe de son camp.",
      camps: P => [['B', 'Bleus', "1er Corps d'Armée", withP('joueur.html?camp=B', P), FLAG], ['A', 'Arbitre', "Poste de l'arbitre", withP('arbitre.html', P), SCALE], ['R', 'Rouges', '3e Armée interarmes', withP('joueur.html?camp=R', P), STAR]] },
    duel: { sub: 'Mode duel · arbitrage automatique', note: "Celui qui crée la partie choisit le plateau et son camp, puis transmet le code.\nSon adversaire n'a qu'à saisir ce code : il reçoit le plateau et le camp restant.",
      camps: P => [['B', 'Bleus', "1er Corps d'Armée", withP('joueur.html?mode=duel&camp=B&nouvelle=1', P), FLAG], ['R', 'Rouges', '3e Armée interarmes', withP('joueur.html?mode=duel&camp=R&nouvelle=1', P), STAR]] },
    solo: { sub: "Mode solo · contre l'ordinateur", note: "Choisissez votre camp, puis le chef adverse qui vous fait face.\nLa partie reste dans ce navigateur : pas besoin de connexion.",
      camps: P => [['B', 'Bleus', "1er Corps d'Armée", `#solo/${P}/B`, FLAG], ['R', 'Rouges', '3e Armée interarmes', `#solo/${P}/R`, STAR]] },
  };
  const $ = s => document.querySelector(s);
  let CUR = '';   // étape affichée, sous la forme du hash : wargame, wargame/suwalki, duel, duel/creer, duel/creer/ukraine, duel/rejoindre, solo, solo/suwalki
  function card(c, n, u, href, ic, tg) {
    const a = document.createElement('a'); a.className = 'camp ' + c; a.href = href;
    a.innerHTML = ic + '<span class="n"></span><span class="u"></span>' + (tg ? '<span class="tg"></span>' : '');
    a.querySelector('.n').textContent = n; a.querySelector('.u').textContent = u; if (tg) a.querySelector('.tg').textContent = tg;
    a.addEventListener('click', e => {
      if (href[0] === '#') { e.preventDefault(); const h = href.slice(1), b = h.match(/^solo\/(\w+)\/([BR])$/); if (b) showBots(b[2], b[1], true); else enter(h, true); return; }
      if (e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); go(href); });
    return a;
  }
  function enter(step, push) {
    const [mode, x, y] = step.split('/'), M = MODES[mode]; if (!M) return leave();
    const P = mode === 'duel' ? (x === 'creer' && PLATEAUX[y] ? y : null) : (PLATEAUX[x] ? x : null);
    const box = $('#camps'); box.replaceChildren(); box.className = 'camps';
    document.body.classList.toggle('solo', mode === 'solo' && !!P);
    document.body.classList.toggle('surcarte', !P && !(mode === 'duel' && (!x || x === 'rejoindre'))); $('#repriseErr').textContent = '';
    let titre, note = M.note;
    if (mode === 'duel' && !x) {
      titre = 'Créer ou rejoindre ?';
      box.append(card('CR', 'Créer', 'Une nouvelle partie : vous choisissez le plateau et votre camp', '#duel/creer', PLUS),
                 card('RJ', 'Rejoindre', 'La partie de votre adversaire, avec son code', '#duel/rejoindre', KEY));
    } else if (mode === 'duel' && x === 'rejoindre') {
      titre = 'Rejoindre une partie'; note = "Le plateau et votre camp sont ceux que votre adversaire a laissés en créant la partie.\nDepuis cet appareil, vous retrouverez ensuite la partie avec le même code.";
      const f = document.createElement('form'); f.className = 'code'; f.noValidate = true;
      f.innerHTML = '<label for="codeIn">Code de la partie</label><div class="row"><input id="codeIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="······"><button type="submit">Rejoindre</button></div><p class="err" aria-live="polite"></p>';
      const inp = f.querySelector('input'), err = f.querySelector('.err');
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); err.textContent = ''; });
      f.addEventListener('submit', e => { e.preventDefault(); if (inp.value.length !== 6) { err.textContent = 'Le code compte 6 caractères.'; inp.focus(); return; } go('joueur.html?mode=duel&salle=' + inp.value); });
      box.append(f); setTimeout(() => inp.focus({ preventScroll: true }), 800);
    } else if (!P) {
      titre = 'Choisissez le plateau';
      const base = mode === 'duel' ? 'duel/creer/' : mode + '/';
      drawZones(base);   // 12 nov. : le plateau se choisit en cliquant sa zone sur la carte (plus de boutons)
      note = 'Cliquez sur la zone de la carte où vous voulez vous battre.' + (mode === 'duel' ? "\nVous créez la partie : le plateau choisi s'impose à votre adversaire." : '');
    } else {
      titre = 'Choisissez votre camp';
      const cs = M.camps(P); if (cs.length === 3) box.classList.add('three');
      for (const [c, n, u, href, ic] of cs) box.append(card(c, n, u, href, ic));
    }
    $('#ct').textContent = titre;
    const sub = $('#cs'); sub.textContent = M.sub;
    if (P) { const s = document.createElement('span'); s.className = 'pl'; s.textContent = ' · ' + PLATEAUX[P].n; sub.append(s); }
    $('#note').textContent = note;
    const fresh = !document.body.classList.contains('in') || CUR !== step;
    if (fresh && document.body.classList.contains('in')) { const c = $('#camp'); c.animate([{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 320, easing: 'ease-out' }); }
    CUR = step; document.body.classList.add('in');
    if (push) history.pushState({ step }, '', '#' + step);
  }
  function leave() { hideBots(); CUR = ''; document.body.classList.remove('in', 'go', 'solo', 'surcarte'); }
  // 12 nov. : un cadre lumineux par plateau sur la carte de l'Europe ; il mène au même endroit que le bouton du plateau
  const NS = 'http://www.w3.org/2000/svg';
  function drawZones(base) {
    const g = $('#zones'); g.replaceChildren();
    for (const [k, T] of Object.entries(PLATEAUX).sort((a, b) => (b[0] === 'focsani') - (a[0] === 'focsani'))) {   // Focșani dessous : le front ukrainien reste cliquable là où les cadres se recouvrent
      const z = document.createElementNS(NS, 'g'); z.setAttribute('class', 'zone ' + T.cl); z.setAttribute('tabindex', '0'); z.setAttribute('role', 'button'); z.setAttribute('aria-label', T.n);
      const poly = document.createElementNS(NS, 'polygon'); poly.setAttribute('points', ZONES_CARTE.frames[k]); z.append(poly);
      const pts = ZONES_CARTE.frames[k].split(' ').map(p => p.split(',').map(Number));   // nom de la zone au centre de son cadre
      let lx = pts.reduce((a, p) => a + p[0], 0) / pts.length, ly = pts.reduce((a, p) => a + p[1], 0) / pts.length;
      if (k === 'focsani') [lx, ly] = ZONES_CARTE.lbl.focsani;   // nom posé hors du cadre du front ukrainien, qui recouvre un coin du cadre
      const t = document.createElementNS(NS, 'text'); t.setAttribute('x', lx); t.setAttribute('y', ly + 8); t.textContent = T.n; z.append(t);
      const open = () => enter(base + k, true);
      z.addEventListener('click', open); z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      const c = () => document.querySelector(`#camps .camp[data-p="${k}"]`);
      z.addEventListener('mouseenter', () => c()?.classList.add('hot')); z.addEventListener('mouseleave', () => c()?.classList.remove('hot'));
      g.append(z);
    }
    for (const a of document.querySelectorAll('#camps .camp[data-p]')) {
      a.addEventListener('mouseenter', () => g.querySelector('.zone.' + PLATEAUX[a.dataset.p].cl).classList.add('hot'));
      a.addEventListener('mouseleave', () => g.querySelector('.zone.' + PLATEAUX[a.dataset.p].cl).classList.remove('hot'));
    }
    fitCarte();
  }
  // écran étroit (téléphone en portrait) : la carte se resserre autour des deux cadres
  function fitCarte() {
    const svg = $('#carte'), [x, y, w, h] = ZONES_CARTE.vb;
    if (innerWidth / innerHeight >= 1.15) { svg.setAttribute('viewBox', `${x} ${y - h * .07} ${w} ${h}`); svg.setAttribute('preserveAspectRatio', 'xMidYMid slice'); return; }
    const pts = Object.values(ZONES_CARTE.frames).join(' ').split(' ').map(p => p.split(',').map(Number));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const m = 70;
    svg.setAttribute('viewBox', `${Math.min(...xs) - m} ${Math.min(...ys) - m * 1.6} ${Math.max(...xs) - Math.min(...xs) + 2 * m} ${Math.max(...ys) - Math.min(...ys) + m * 3.2}`); svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  }
  addEventListener('resize', () => { if (document.body.classList.contains('surcarte')) fitCarte(); });
  const go = href => { document.body.classList.add('go'); setTimeout(() => { location.href = href; }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 750); };

  // ---------------------------------------------------------------- 10 nov. : choix du bot (mode solo), pour les deux camps
  // Le joueur Bleu affronte un chef russe, le joueur Rouge un chef français. La partie est créée par la page joueur (joueur.html?mode=solo&camp=X&bot=id).
  const PORTRAITS = { popov: 1, boris: 1, ivan: 1, svietchine: 1, toukhatchevski: 1, gerasimov: 1, tchouikov: 1, rokossovski: 1, koniev: 1, joukov: 1,
    tim: 1, bagar: 1, jeanmichel: 1, colo: 1, santo: 1, galula: 1, ardant: 1, yako: 1, beaufre: 1, foch: 1 };   // portraits/<id>.gif
  const campOf = p => /bleu/i.test(String(p.camps || '')) && !/deux/i.test(String(p.camps || '')) ? 'B' : 'R';
  const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const SFX = P => P && P !== 'ukraine' ? '-' + P : '';   // une partie solo par plateau dans ce navigateur
  function soloSaved(P) {   // partie solo en cours sur ce plateau dans ce navigateur (même origine que la page joueur)
    try { const db = JSON.parse(localStorage.getItem('rasp-solo-partie' + SFX(P)) || '{}') || {}; const i = db.solo; if (!i || !i.id) return null;
      let ended = false; try { const sv = JSON.parse(db.arbitre && db.arbitre.sauvegarde || 'null'); ended = !!(sv && sv.state && sv.state.ended); } catch (e) {}
      return { id: i.id, camp: i.camp || 'B', plateau: P || 'ukraine', surprise: !!i.surprise, tour: (db.arbitre && db.arbitre.tour) || 0, ended };
    } catch (e) { return null; }
  }
  function hideBots() { document.body.classList.remove('bot', 'fr'); const r = document.documentElement.style; r.removeProperty('--zoom-x'); r.removeProperty('--zoom-y'); }
  function showBots(pc, P, push) {
    if (!PLATEAUX[P]) P = 'ukraine';
    if (!document.body.classList.contains('in') || CUR !== 'solo/' + P) enter('solo/' + P, false);
    const BC = pc === 'B' ? 'R' : 'B', FR = BC === 'B', chefs = FR ? 'chefs français' : 'chefs russes';
    const r = document.documentElement.style; r.setProperty('--zoom-x', FR ? (innerWidth <= 720 ? '20%' : '14%') : (innerWidth <= 720 ? '80%' : '86%')); r.setProperty('--zoom-y', '42%');
    document.body.classList.add('bot'); document.body.classList.toggle('fr', FR);
    $('#botS').textContent = (pc === 'B' ? "Vous commandez le 1er Corps d'Armée" : 'Vous commandez la 3e Armée interarmes') + ' · ' + PLATEAUX[P].n + ' · du plus faible au plus fort';
    const all = (typeof RASP_BOT_PROFILS !== 'undefined' ? RASP_BOT_PROFILS : []).filter(p => campOf(p) === BC).sort((a, b) => a.rang - b.rang);
    const bots = all.map(p => ({ id: p.id, nom: p.nom, desc: p.desc, niv: +p.niveau || 0 }));
    bots.push({ id: '?', nom: 'Adversaire surprise', desc: `Un des ${chefs}, tiré au hasard. Vous ne saurez lequel qu'à la fin de la partie.`, niv: 0 });
    const sv = soloSaved(P), cur = sv && sv.camp === pc && !sv.ended ? sv : null;
    if (cur) { const p = all.find(x => x.id === cur.id); bots.unshift({ id: '=', nom: 'Reprendre la partie', desc: `Votre partie en cours contre ${cur.surprise ? 'un adversaire surprise' : (p ? p.nom : cur.id)}${cur.tour ? ', au tour ' + cur.tour : ''}.`, niv: 0, cur: true }); }
    const col = $('#botCol'), med = $('#botMed'); col.setAttribute('aria-label', (FR ? 'Chefs français' : 'Chefs russes') + ', du plus faible au plus fort');
    let pick = null;
    const items = bots.map((b, i) => { const x = mk('button', 'nm' + (b.id === '?' ? ' sur' : '') + (b.cur ? ' cur' : '')); x.type = 'button'; x.setAttribute('role', 'option'); x.setAttribute('aria-selected', 'false');
      x.append(mk('span', 't', b.nom), mk('span', 'lv', b.niv ? stars(b.niv) : b.cur ? '›' : '?')); x.onclick = () => choose(i); return x; });
    col.replaceChildren(...items);
    function show() {
      const por = mk('div', 'por');
      if (!pick) { por.append(mk('span', 'q', '?')); med.replaceChildren(por, mk('p', 'hint', `Choisissez un ${FR ? 'chef français dans la colonne de droite' : 'chef russe dans la colonne de gauche'}.`)); return; }
      const pid = pick.cur ? (cur.surprise ? '?' : cur.id) : pick.id;
      if (PORTRAITS[pid]) { const im = mk('img'); im.src = `portraits/${pid}.gif`; im.alt = 'Portrait de ' + pick.nom; por.append(im); } else por.append(mk('span', 'q', pick.cur ? '›' : '?'));
      const ok = mk('button', 'ok', pick.cur ? 'Reprendre' : "Valider l'adversaire"); ok.type = 'button';
      ok.onclick = () => go(withP(`joueur.html?mode=solo&camp=${pc}` + (pick.cur ? '' : '&bot=' + encodeURIComponent(pick.id)), P));
      const kids = [por, mk('div', 't', pick.nom)]; if (pick.niv) kids.push(mk('div', 'lv', stars(pick.niv)));
      kids.push(mk('p', 'd', pick.desc));
      if (!pick.cur && sv && !sv.ended) kids.push(mk('p', 'warn', sv.camp === pc ? 'La partie en cours sera effacée.' : 'La partie solo en cours sur ce plateau (' + (sv.camp === 'B' ? 'Bleus' : 'Rouges') + ') sera effacée.'));
      kids.push(ok); med.replaceChildren(...kids);
    }
    function choose(i, focus) { pick = bots[i]; items.forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-selected', String(j === i)); }); items[i].scrollIntoView({ block: 'nearest' }); if (focus) items[i].focus(); show(); }
    col.onkeydown = e => { const i = pick ? bots.indexOf(pick) : -1;
      if (e.key === 'ArrowDown') { e.preventDefault(); choose(Math.min(bots.length - 1, i + 1), true); } else if (e.key === 'ArrowUp') { e.preventDefault(); choose(Math.max(0, i - 1), true); } };
    show();
    for (const b of bots) if (PORTRAITS[b.id]) { const im = new Image(); im.src = `portraits/${b.id}.gif`; }   // préchargement
    if (push) history.pushState({ step: `solo/${P}/${pc}` }, '', `#solo/${P}/${pc}`);
  }
  document.querySelectorAll('.btn[data-mode]').forEach(b => b.addEventListener('click', () => { if (b.getAttribute('aria-disabled') === 'true') return; enter(b.dataset.mode, true); }));
  const back = () => { if (history.state && history.state.step) return history.back();   // étape précédente
    const up = CUR.split('/').slice(0, -1).join('/'); if (document.body.classList.contains('bot')) { hideBots(); history.replaceState({ step: CUR }, '', '#' + CUR); return; }
    if (up) { history.replaceState({ step: up }, '', '#' + up); enter(up, false); } else { history.replaceState(null, '', location.pathname + location.search); leave(); } };
  // 10 nov. : reprise d'une partie solo enregistrée avec « Sauvegarder » (fichier raspoutitsa-solo-…json)
  $('#reprise').addEventListener('click', () => {
    const fin = document.createElement('input'); fin.type = 'file'; fin.accept = '.json,application/json'; fin.hidden = true; document.body.append(fin);
    fin.onchange = async () => { const f = fin.files[0]; fin.remove(); if (!f) return; const err = $('#repriseErr');
      try { const d = JSON.parse(await f.text());
        if (!d || d.app !== 'raspoutitsa-joueur' || !d.S || !d.S.camp) throw new Error("Ce fichier n'est pas une sauvegarde de la page joueur.");
        if (!d.solo || !d.solo.solo || !d.solo.arbitre) throw new Error("Ce fichier n'est pas une sauvegarde de partie solo complète : enregistrez-la avec « Sauvegarder » depuis la page solo (version du 10 novembre ou plus récente).");
        const c = d.S.camp, P = PLATEAUX[d.solo.solo.plateau] ? d.solo.solo.plateau : (d.S.units || []).some(u => /^(Kaliningrad|Suwałki|Białystok|Brest) /.test(u.slot || '')) ? 'suwalki' : (d.S.units || []).some(u => /^(Carpates|Focșani|Boudjak) /.test(u.slot || '')) ? 'focsani' : 'ukraine';
        const sv = soloSaved(P); if (sv && !sv.ended && !confirm('La partie solo en cours sur ce plateau dans ce navigateur sera remplacée. Continuer ?')) return;
        localStorage.setItem('rasp-solo-partie' + SFX(P), JSON.stringify(d.solo));
        localStorage.removeItem('rasp-joueur-solo-v1-B' + SFX(P)); localStorage.removeItem('rasp-joueur-solo-v1-R' + SFX(P));
        localStorage.setItem('rasp-joueur-solo-v1-' + c + SFX(P), JSON.stringify(d.S));
        err.textContent = ''; go(withP('joueur.html?mode=solo&camp=' + c, P));
      } catch (e) { err.textContent = e instanceof SyntaxError ? 'Fichier illisible.' : e.message; }
    };
    fin.click();
  });
  $('#back').addEventListener('click', back); $('#back2').addEventListener('click', back);
  const route = () => { let m = decodeURIComponent(location.hash.slice(1)); const old = m.match(/^solo-([BR])$/); if (old) { m = 'solo/ukraine/' + old[1]; history.replaceState({ step: m }, '', '#' + m); }   // anciens liens #solo-B
    const b = m.match(/^solo\/(\w+)\/([BR])$/); if (b) return showBots(b[2], b[1], false); hideBots(); if (MODES[m.split('/')[0]]) enter(m, false); else leave(); };
  addEventListener('popstate', route);
  addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('go'); const b = location.hash.match(/^#solo\/(\w+)\/([BR])$/); if (b) showBots(b[2], b[1], false); } });   // retour arrière depuis une page joueur
  route();
})();
</script>
